  function vanCollectDialog(x, after) {
    var net = r2(x.NetTotal);
    var row = function (id, label, extra) {
      return '<div class="vc-row"><div class="vc-label">' + esc(label) + '</div><input class="input num" type="number" step="any" min="0" id="' + id + '" placeholder="0.00">' + (extra || '') + '</div>';
    };
    var m = modal({
      title: t('cl.vanTitle', { no: x.DocNo }), sticky: true,
      body: '<div class="vc-head"><div class="muted">' + esc(x.PartyName) + '</div><div class="vc-total">' + money(net) + '</div><div class="muted small">' + t('cl.mustPay') + '</div></div>' +
        row('vcCash', t('cl.cash')) +
        row('vcTr', t('cl.transfer'), '<input class="input" id="vcTrRef" placeholder="' + esc(t('f.RefNo')) + '">') +
        row('vcQr', 'QR Payment', '<input class="input" id="vcQrName" placeholder="' + esc(t('cl.payerName')) + '"><input class="input" id="vcQrRef" placeholder="' + esc(t('f.RefNo')) + '">') +
        '<div class="vc-remain" id="vcRemain"></div><div class="muted small">' + t('cl.vanHint') + '</div>',
      foot: '<button class="btn" data-later type="button">' + t('cl.later') + '</button><button class="btn btn-primary" data-ok type="button">' + icon('check') + t('cl.saveCollect') + '</button>'
    });
    var el = m.el;
    if (x.PaymentType === 'TRANSFER') $('#vcTr', el).value = net.toFixed(2); else $('#vcCash', el).value = net.toFixed(2);
    var sum = function () { return r2(num($('#vcCash', el).value) + num($('#vcTr', el).value) + num($('#vcQr', el).value)); };
    var upd = function () {
      var d = r2(net - sum());
      $('#vcRemain', el).innerHTML = Math.abs(d) < 0.005 ? '<span class="stock-ok">✓ ' + t('cl.balanced') + '</span>' : '<span class="stock-low">' + t('cl.remain') + ' ' + money(d) + '</span>';
    };
    ['#vcCash', '#vcTr', '#vcQr'].forEach(function (s) { $(s, el).oninput = upd; });
    upd();
    $('[data-later]', el).onclick = function () { m.close(); if (after) after(null); };
    $('[data-ok]', el).onclick = function () {
      if (Math.abs(r2(net - sum())) >= 0.005) { toast(t('cl.notBalanced'), 'err'); return; }
      var lines = [{ Kind: 'INV', RefDocId: x.DocId, Amount: net }];
      if (num($('#vcCash', el).value) > 0) lines.push({ Kind: 'CASH', Amount: r2(num($('#vcCash', el).value)) });
      if (num($('#vcTr', el).value) > 0) lines.push({ Kind: 'TRANSFER', Amount: r2(num($('#vcTr', el).value)), RefNo: $('#vcTrRef', el).value.trim(), PayDate: U.today() });
      if (num($('#vcQr', el).value) > 0) lines.push({ Kind: 'QR', Amount: r2(num($('#vcQr', el).value)), PayerName: $('#vcQrName', el).value.trim(), RefNo: $('#vcQrRef', el).value.trim(), PayDate: U.today() });
      this.disabled = true;
      var self = this;
      call('apiCollectionSave', { PartyId: x.PartyId, lines: lines }, { submit: true }).then(function (cl) {
        m.close();
        toast(t('cl.vanSaved', { no: cl.DocNo }), 'ok', 4000);
        U.refreshBadges();
        if (after) after(cl); else U.refresh();
      }).catch(function () { self.disabled = false; });
    };
  }

  function drawCollection(el, r, p) {
    p = p || {};
    var d = r ? r.doc : null;
    var a = r ? r.actions : { edit: true };
    var editable = !d || !!a.edit;
    var isVan = U.role() === 'VAN';
    var st = { docId: d ? d.DocId : '', party: null, salesRepId: d ? d.SalesRepId : '', note: d ? d.Note : '', rows: [] };
    (r && r.cl || []).forEach(function (l) { st.rows.push(Object.assign({ _k: U.uid() }, l)); });
    return U.loadParties('C').then(function (parties) {
      var pid = d ? d.PartyId : (p.party || '');
      st.party = parties.filter(function (x) { return x.id === pid; })[0] || (d ? { id: d.PartyId, name: d.PartyName, address: d.PartyAddress } : null);
      if (!d && st.party && !st.salesRepId) st.salesRepId = st.party.salesRepId || '';
      var pre = !d && p.inv && st.party ? call('apiCollectOpenDocs', st.party.id, '').then(function (list) {
        var x = list.filter(function (i) { return i.DocId === p.inv; })[0];
        if (x) st.rows.push({ _k: U.uid(), Kind: 'INV', RefDocId: x.DocId, RefDocNo: x.DocNo, DocAmount: x.NetTotal, Outstanding: x.Outstanding, Amount: x.Outstanding });
      }) : Promise.resolve();
      return pre.then(function () { draw(); });

      function totals() {
        var tt = { INV: 0, CN: 0, CASH: 0, CHEQUE: 0, TRANSFER: 0, QR: 0 };
        st.rows.forEach(function (l) { tt[l.Kind] = r2(tt[l.Kind] + num(l.Amount)); });
        tt.pay = r2(tt.CASH + tt.CHEQUE + tt.TRANSFER + tt.QR);
        tt.remain = r2(tt.INV - tt.CN - tt.pay);
        return tt;
      }
      function draw() {
        var frow = function (label, inner, req) {
          return '<div class="frow"><label>' + esc(label) + (req ? ' <span class="req">*</span>' : '') + '</label><div class="fctl">' + inner + '</div></div>';
        };
        var ro = function (v) { return '<input class="input" readonly value="' + esc(v || '') + '">'; };
        var fval = function (v) { return '<div class="fval">' + (v ? esc(v) : '-') + '</div>'; };
        var btn = function (id, label, cls, ic) { return '<button class="btn ' + (cls || '') + '" ' + id + ' type="button">' + (ic ? icon(ic) : '') + esc(label) + '</button>'; };
        var canApprove = U.role() === 'ADMIN' || U.role() === 'SUPPORT' || U.role() === 'ACC';
        var btns = btn('id="clBack"', '‹ ' + t('back'));
        if (editable) {
          btns += btn('id="clSave"', t('save'), '', 'check');
          if (canApprove) btns += btn('id="clApprove"', t('ed.saveApprove'), 'btn-primary', 'check');
          else btns += btn('id="clSubmit"', t('ed.saveSend'), 'btn-primary', 'check');

  /** หน้าต่างนำเข้า CSV ทั่วไป */
  function importCsvDialog(title, headerLine, send, done, extraHint) {
    var m = modal({
      title: title, wide: true,
      body: (extraHint ? '<div class="alert info">' + esc(extraHint) + '</div>' : '') + '<p>' + t('imp.hint') + '</p><pre class="small" style="white-space:pre-wrap;background:var(--bg);padding:8px;border-radius:8px">' + esc(headerLine) + '</pre>' +
        '<div class="btn-row"><button class="btn" id="impTpl" type="button">' + icon('download') + t('imp.template') + '</button>' +
        '<button class="btn btn-primary" id="impPick" type="button">' + icon('upload') + t('imp.pick') + '</button></div><div class="gap"></div><div id="impRes"></div>'
    });
    $('#impTpl', m.el).onclick = function () { U.downloadCsv('template.csv', headerLine.split(','), []); };
    $('#impPick', m.el).onclick = function () {
      U.pickFile('.csv,text/csv', false).then(function (file) {
        if (!file) return;
        var fr = new FileReader();
        fr.onload = function () {
          var rows = U.parseCsv(fr.result);
          if (!rows.length) { toast(t('imp.empty'), 'err'); return; }
          send(rows).then(function (r) {
            $('#impRes', m.el).innerHTML = '<div class="alert ok">' + t('imp.result', { a: r.added, u: r.updated, e: r.errors.length }) + '</div>' +
              (r.errorCount > r.errors.length ? '<div class="muted small">' + t('imp.moreErrors', { n: r.errorCount - r.errors.length }) + '</div>' : '') +
              (r.errors.length ? '<div class="alert err">' + r.errors.slice(0, 50).map(function (e) {
                var p = String(e.error).split('|');
                var params = {};
                try { params = JSON.parse(p[1] || '{}'); } catch (x) { params = {}; }
                return t('imp.row', { n: e.row }) + ': ' + esc(t(p[0], params));
              }).join('<br>') + '</div>' : '');
            done();
          }).catch(noop);
        };
        fr.readAsText(file, 'utf-8');
      });
    };
  }

  };
  function lkOptions(type, value, allowEmpty) {
    var list = LK(type).map(function (o) { return { v: o.code, l: L(o.nameTh, o.nameEn) }; });
    if (value && !list.some(function (o) { return o.v === value; })) list.push({ v: value, l: value });

  var GEO = null;
  function loadGeo() {
    if (GEO) return Promise.resolve(GEO);
    var cached = null;
    try { cached = JSON.parse(U.store.get('geo') || 'null'); } catch (e) { cached = null; }
    return call('apiGeo').then(function (g) {
      GEO = (g && Array.isArray(g.p)) ? g : { v: '', p: [] };
      if (g.p && g.p.length) { try { U.store.set('geo', JSON.stringify(g)); } catch (e) { /* เต็ม */ } }
      return GEO;
    }).catch(function () { GEO = (cached && Array.isArray(cached.p)) ? cached : { v: '', p: [] }; return GEO; });
  }
  function geoProvinces() { return (GEO && GEO.p || []).map(function (x) { return x[0]; }); }
  function geoDistricts(prov) { var p = (GEO && GEO.p || []).filter(function (x) { return x[0] === prov; })[0]; return p ? p[1].map(function (d) { return d[0]; }) : []; }
  function geoSubs(prov, dist) {
    var p = (GEO && GEO.p || []).filter(function (x) { return x[0] === prov; })[0];
    var d = p ? p[1].filter(function (x) { return x[0] === dist; })[0] : null;

          U.field(t('f.DiscountRate') + ' (%)', numIn('DiscountRate', true, 'max="100"'), true) +
          chk('BlockOverLimit', t('f.BlockOverLimit'), true) +
          '</div></div>' +
          // ---------- OTHER ----------
          '<div class="gap"></div><div class="card-title"><h3>' + t('cust.secOther') + '</h3></div><div class="grid grid-2 stack">' +
          lkSel('OWNERSHIP_TYPE', 'OwnershipType', false) + lkSel('BRAND_PRIORITY', 'BrandPriority', false) +
          lkSel('SHOP_TYPE', 'ShopType', false) + lkSel('CUSTOMER_CHAIN', 'CustomerChain', false) +
          lkSel('VISIT_FREQUENCY', 'VisitFrequency', false) + lkSel('CONTRACT_TYPE', 'ContractType', false) +
          chk('SpecialGroup', t('f.SpecialGroup'), true) + '</div></div>';

        // ---------- PICTURES + GPS ----------
        html += '<div class="card"><div class="card-title"><h3>' + t('cust.secPictures') + '</h3>' + (!isNew && (canEdit || c.canGps) ? '<div class="btn-row">' +
          '<button class="btn btn-sm" id="cePhotoCam" type="button">' + icon('camera') + t('doc.camera') + '</button>' +
          '<button class="btn btn-sm" id="cePhotoUp" type="button">' + icon('upload') + t('cust.upload') + '</button></div>' : '') + '</div>' +
          (isNew ? '<div class="muted small">' + t('cust.saveFirst') + '</div>' :
            '<div class="kv" style="margin-bottom:12px"><div><div class="k">GPS</div><div class="v" id="ceGps">' + gpsText(c) + '</div></div>' +
            '<div>' + (c.canGps ? '<button class="btn btn-sm" id="ceGpsNow" type="button">' + icon('home') + t('cust.gpsNow') + '</button>' : '') + '</div></div>' +
            '<div id="cePhotos" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px">' +
            (c.photos.length ? c.photos.map(function (ph) {
              return '<div class="card" style="padding:6px;margin:0"><div data-ph="' + esc(ph.PhotoId) + '" style="height:120px;background:var(--bg);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden">' +
                icon('camera') + '</div><div class="small muted" style="margin-top:4px">' + esc(U.dateFmt(ph.TakenAt)) + '<br>' + esc(ph.TakenByName) +
                (ph.Lat ? ' · <a href="https://maps.google.com/?q=' + esc(ph.Lat) + ',' + esc(ph.Lng) + '" target="_blank" rel="noopener">GPS</a>' : '') +
                (canEdit ? ' · <a data-phdel="' + esc(ph.PhotoId) + '">' + t('delete') + '</a>' : '') + '</div></div>';
            }).join('') : '<div class="muted small">' + t('noData') + '</div>') + '</div>') + '</div>';
        if (!isNew) html += '<p class="muted small">' + t('cust.meta', { by: c.CreatedByName || '-', at: U.dateFmt(c.CreatedAt), docs: c.DocCount || 0 }) + '</p>';
        el.innerHTML = html;

        // ---------- ที่อยู่แบบเลือกต่อกัน ----------
        var ps = $('#ceProv'), ds = $('#ceDist'), ss = $('#ceSub'), pc = $('[name=Postcode]', el);
        var opts = function (list, val) {
          var arr = list.slice();
          if (val && arr.indexOf(val) < 0) arr.unshift(val);
          return '<option value="">' + t('cust.pleaseSelect') + '</option>' + arr.map(function (x) { return '<option' + (x === val ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('');
        };
        var fill = function (level) {
          if (level <= 0) ps.innerHTML = opts(geoProvinces(), c.Province);
          if (level <= 1) ds.innerHTML = opts(geoDistricts(ps.value), level === 0 ? c.District : '');
          if (level <= 2) ss.innerHTML = opts(geoSubs(ps.value, ds.value).map(function (x) { return x[0]; }), level === 0 ? c.Subdistrict : '');
        };
        fill(0);
        if (!geoProvinces().length && canEdit) toast(t('cust.noGeo'), 'warn', 6000);
        ps.onchange = function () { fill(1); };
        ds.onchange = function () { fill(2); };
        ss.onchange = function () {
          var hit = geoSubs(ps.value, ds.value).filter(function (x) { return x[0] === ss.value; })[0];
          if (hit && hit[1]) pc.value = hit[1];
        };
        // ช่องจ่ายเงิน: เงินสด → เครดิต 0 วัน
        var payS = $('[name=PaymentType]', el);
        if (payS) payS.onchange = function () { if (payS.value === 'CASH' && $('[name=CreditDays]', el) && !$('[name=CreditDays]', el).disabled) $('[name=CreditDays]', el).value = 0; };
        // เพิ่มตัวเลือกใหม่ในรายการ
        $$('[data-lk]', el).forEach(function (s) {
          s.onchange = function () {
            if (s.value !== '__new__') return;
            var v = (window.prompt(t('cust.newOption')) || '').trim();
            if (!v) { s.value = ''; return; }
            var o = document.createElement('option');
            o.value = v; o.textContent = v; o.selected = true;
            s.insertBefore(o, s.lastElementChild);
          };
        });
        // ลูกค้าหลัก (Parent)
        if ($('#ceParent')) $('#ceParent').onclick = function () {
          pickCustomer(function (x) { $('[name=ParentId]', el).value = x.id; $('#ceParentShow').value = x.id + ' ' + x.name; }, c.CustomerId);
        };
        if ($('#ceParentX')) $('#ceParentX').onclick = function () { $('[name=ParentId]', el).value = ''; $('#ceParentShow').value = ''; };

        $('#ceBack').onclick = U.goBack;
        var save = function (approve) {
          var d = U.formData($('#ceForm'));
          if (!d.Name) { toast(t('ERR_REQUIRED', { field: 'Name' }), 'err'); return; }
          if (!d.Province || !d.District) { toast(t('ERR_REQUIRED', { field: 'Province' }) + ' / ' + t('f.District'), 'err'); return; }
          if (manage && !d.PriceGroup) { toast(t('ERR_REQUIRED', { field: 'PriceGroup' }), 'err'); return; }
          if (!isNew) d.CustomerId = c.CustomerId;
          else { d._new = true; if (!manage) delete d.CustomerId; }
          Object.keys(d).forEach(function (k) { if (d[k] === '__new__') d[k] = ''; });
          $$('.action-bar .btn').forEach(function (b) { b.disabled = true; });
          call('apiCustomerSave', d, { approve: !!approve }).then(function (r) {
            toast(t('cust.savedCode', { code: r.CustomerId, st: t(r.Status === 'PENDING' ? 'cust.notApproved' : 'st.' + r.Status) }), 'ok', 4000);
            S.parties = {};
            U.refreshBadges();
            return call('apiLookups').then(function (lk) { S.lookups = lk; go('customerEdit', { id: r.CustomerId }, true); });
          }).catch(function () { $$('.action-bar .btn').forEach(function (b) { b.disabled = false; }); });
        };
        if ($('#ceSave')) $('#ceSave').onclick = function () { save(false); };
        if ($('#ceSaveApprove')) $('#ceSaveApprove').onclick = function () { save(true); };

        // ---------- รูป + GPS ----------
        var getPos = function () {
          return new Promise(function (resolve) {
            if (!navigator.geolocation) { resolve(null); return; }
            navigator.geolocation.getCurrentPosition(function (pos) { resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }); },
              function () { resolve(null); }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
          });
        };
        var upload = function (camera) {
          U.pickFile('image/*', camera).then(function (file) {
            if (!file) return;
            Promise.all([U.readFileB64(file, 1600), getPos()]).then(function (r) {
              var f2 = r[0], pos = r[1] || {};
              return call('apiCustomerPhotoUpload', c.CustomerId, f2.b64, f2.mime, pos.lat || '', pos.lng || '', '');
            }).then(function () { toast(t('doc.uploaded'), 'ok'); U.refresh(); }).catch(noop);
          });
        };
        if ($('#cePhotoCam')) $('#cePhotoCam').onclick = function () { upload(true); };
        if ($('#cePhotoUp')) $('#cePhotoUp').onclick = function () { upload(false); };
        if ($('#ceGpsNow')) $('#ceGpsNow').onclick = function () {
          toast(t('cust.gpsFinding'));
          getPos().then(function (pos) {
            if (!pos) { toast(t('cust.gpsFail'), 'err', 6000); return; }
            U.confirmBox(t('cust.gpsConfirm', { lat: pos.lat.toFixed(6), lng: pos.lng.toFixed(6) })).then(function (ok) {
              if (ok) call('apiCustomerSetGps', c.CustomerId, pos.lat, pos.lng).then(function (g) { c.Lat = g.Lat; c.Lng = g.Lng; $('#ceGps').innerHTML = gpsText(c); toast(t('saved'), 'ok'); }).catch(noop);
            });
          });
        };
        $$('[data-ph]', el).forEach(function (box) {
          call('apiCustomerPhoto', box.getAttribute('data-ph')).then(function (url) {
            box.innerHTML = '<img src="' + esc(url) + '" style="width:100%;height:100%;object-fit:cover">';
            box.onclick = function () { modal({ title: t('cust.secPictures'), wide: true, body: '<img src="' + esc(url) + '" style="width:100%;border-radius:8px">' }); };
          }).catch(noop);
        });
        $$('[data-phdel]', el).forEach(function (a) {
          a.onclick = function () {
            U.confirmBox(t('cust.photoDelete'), { danger: true }).then(function (ok) {
              if (ok) call('apiCustomerPhotoDelete', a.getAttribute('data-phdel')).then(function () { U.refresh(); }).catch(noop);
            });
          };
        });
      });
    }
  };
  function gpsText(c) {
    return c.Lat ? esc(c.Lat) + ', ' + esc(c.Lng) + ' · <a href="https://maps.google.com/?q=' + esc(c.Lat) + ',' + esc(c.Lng) + '" target="_blank" rel="noopener">' + t('cust.openMap') + '</a>'
      : '<span class="muted">' + t('cust.noGps') + '</span>';
  }

  /** เลือกลูกค้า (ใช้กับช่องลูกค้าหลัก) */
  function pickCustomer(onPick, excludeId) {
    var m = modal({ title: t('f.ParentId'), body: '<input class="input" id="pcQ" placeholder="' + esc(t('search')) + '"><div class="gap"></div><div class="list" id="pcList"></div>' });
    var run2 = U.debounce(function () {
      call('apiCustomerList', { q: $('#pcQ', m.el).value.trim(), pageSize: 30, active: 'Y' }).then(function (r) {
        var items = r.items.filter(function (x) { return x.CustomerId !== excludeId; });
        $('#pcList', m.el).innerHTML = items.length ? items.map(function (x) {
          return '<div class="list-item" data-id="' + esc(x.CustomerId) + '" data-n="' + esc(x.Name) + '"><div class="main-col"><div class="title">' + esc(x.Name) +
            '</div><div class="meta">' + esc(x.CustomerId) + ' · ' + esc([x.District, x.Province].filter(Boolean).join(' ')) + '</div></div></div>';
        }).join('') : '<div class="empty">' + t('noData') + '</div>';
        $$('[data-id]', m.el).forEach(function (it) { it.onclick = function () { onPick({ id: it.getAttribute('data-id'), name: it.getAttribute('data-n') }); m.close(); }; });
      }).catch(noop);
    }, 300);
    $('#pcQ', m.el).oninput = run2;
    run2();
  }

  /** ฟอร์มเพิ่มลูกค้าแบบย่อ (เปิดจากหน้าสร้างเอกสาร) */
  function customerQuickForm(_c, done) {
    var manage = U.can('master.customer.manage') === 'ALL';
    loadGeo().then(function () {
      var m = modal({
        title: manage ? t('cust.new') : t('cust.request'), wide: true,
        body: (!manage ? '<div class="alert info">' + t('cust.requestHint') + '</div>' : '') + '<div class="grid grid-2" id="qf">' +
          U.field(t('f.Name'), U.inputH('Name', ''), true) + U.field(t('f.Phone'), U.inputH('Phone', '', 'type="tel"')) +
          U.field(t('f.Province'), '<select class="input" name="Province" id="qProv"></select>', true) +
          U.field(t('f.District'), '<select class="input" name="District" id="qDist"></select>', true) +
          U.field(t('f.Subdistrict'), '<select class="input" name="Subdistrict" id="qSub"></select>') +
          U.field(t('f.PaymentType'), U.selectH('PaymentType', [{ v: 'CASH', l: t('pay.CASH') }, { v: 'CREDIT', l: t('pay.CREDIT') }], 'CASH')) +
          U.field(t('f.TaxId'), U.inputH('TaxId', '', 'inputmode="numeric" maxlength="13"')) +
          (manage ? U.field(t('f.PriceGroup'), U.selectH('PriceGroup', lkOptions('PRICE_GROUP', ''), ''), true) : '') +
          '</div>' + U.field(t('f.Address'), '<textarea class="input" name="Address"></textarea>'),
        foot: '<button class="btn" data-full type="button">' + t('cust.fullForm') + '</button><button class="btn btn-primary" data-s type="button">' + t('save') + '</button>'
      });
      var ps = $('#qProv', m.el), ds = $('#qDist', m.el), ss = $('#qSub', m.el);
      var o = function (l) { return '<option value="">' + t('cust.pleaseSelect') + '</option>' + l.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join(''); };
      ps.innerHTML = o(geoProvinces());
      ps.onchange = function () { ds.innerHTML = o(geoDistricts(ps.value)); ss.innerHTML = o([]); };
      ds.onchange = function () { ss.innerHTML = o(geoSubs(ps.value, ds.value).map(function (x) { return x[0]; })); };
      $('[data-full]', m.el).onclick = function () { m.close(); go('customerEdit', {}); };
      $('[data-s]', m.el).onclick = function () {
        var d = U.formData(m.el);
        var hit = geoSubs(d.Province, d.District).filter(function (x) { return x[0] === d.Subdistrict; })[0];
        if (hit) d.Postcode = hit[1];
        d._new = true;
        d.AutoCode = true;
        d.IsActive = true;
        call('apiCustomerSave', d, { approve: U.can('master.customer.approve') === 'ALL' }).then(function (r) {
          m.close();
          toast(r.Status === 'PENDING' ? t('cust.requested') : t('cust.savedCode', { code: r.CustomerId, st: t('st.' + r.Status) }), 'ok', 4000);
          S.parties = {};
          if (done) done(r.CustomerId);
        }).catch(noop);
      };
    });

  R.reports = {

            .map(function (v) { return { v: v, l: t('gb.' + v) }; }), f.groupBy || 'product'));

          if (cur === 'promo') html += '<label class="check" style="margin-bottom:22px"><input type="checkbox" name="detail"' + (f.detail ? ' checked' : '') + '>' + t('rep.detail') + '</label>';
          if (U.can('report.sales') === 'ALL' && (cur === 'sales' || cur === 'ar')) {

        var runRep = function () {

    $('#rCsv').onclick = function () {
      U.downloadCsv('report_' + id + '_' + U.today() + '.csv', cols.map(function (c) { return c.label; }),

    };
    $('#rPrint').onclick = function () {
      var meta = S.boot.settings;
      var html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(r.title) + '</title><style>@page{size:A4 landscape;margin:10mm}body{font-family:Tahoma,"Noto Sans Thai",sans-serif;font-size:11px;color:#3B2F2A}' +
        'table{width:100%;border-collapse:collapse}th{background:#8B5E3C;color:#fff;padding:4px;text-align:left}td{border-bottom:1px solid #E8DFD3;padding:3px 4px}.n{text-align:right}tfoot td{font-weight:bold}</style></head><body>' +
        '<h2 style="margin:0">' + esc(meta.COMPANY_NAME) + '</h2><h3 style="margin:4px 0">' + esc(r.title) + '</h3><div>' + esc(filterText(r.filters)) + '</div><br><table><thead><tr>' +
        cols.map(function (c) { return '<th class="' + (['money', 'qty', 'num', 'pct'].indexOf(c.type) >= 0 ? 'n' : '') + '">' + esc(c.label) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        r.rows.map(function (row) { return '<tr>' + cols.map(function (c) { return '<td class="' + (['money', 'qty', 'num', 'pct'].indexOf(c.type) >= 0 ? 'n' : '') + '">' + U.fmtCell(row[c.key], c.type) + '</td>'; }).join('') + '</tr>'; }).join('') +
        '</tbody><tfoot><tr>' + cols.map(function (c, i) { var v = r.totals[c.key]; return '<td class="n">' + (v === undefined ? (i === 0 ? t('total') : '') : U.fmtCell(v, c.type)) + '</td>'; }).join('') +
        '</tr></tfoot></table><p style="color:#8A7B70">' + esc(U.dateFmt(U.today())) + '</p></body></html>';
      U.printHtml(html);

  function filterText(f) {
    if (!f) return '';
    var parts = [];
    if (f.dateFrom) parts.push(U.dateFmt(f.dateFrom) + ' – ' + U.dateFmt(f.dateTo));
    if (f.asOf) parts.push(t('f.asOf') + ' ' + U.dateFmt(f.asOf));
    if (f.channel) parts.push(t('ch.' + f.channel));
    if (f.groupBy) parts.push(t('gb.' + f.groupBy));

    return parts.join(' · ');
  }

  // ===============================================================
  //  รายงานรูปแบบ SmartSales (ตัวกรองเลือกหลายค่า + Excel / CSV / พิมพ์)
  // ===============================================================
  // ช่องกรองของแต่ละรายงาน: 'ชื่อ' = เลือกหลายค่า, ['text', ชื่อ], ['yn', ชื่อ], ['date']
  // ตัวกรองมาตรฐานของทุกรายงาน (ตามที่ผู้ใช้กำหนด)
  var RPT_STD_FILTERS = [['date'], 'distributor', 'salesman', 'customer', 'product', 'docStatus', 'docType'];
  var RPT_FILTERS = {
    SalesDocumentsDetails: RPT_STD_FILTERS
  };
  var RPT_ROW_LIMIT = 3000;
  var r2 = function (n) { return Math.round((num(n) + Number.EPSILON) * 100) / 100; };

  R.rpt = {
    title: function (p) { return t('menu.reports') + ' · ' + String(p.id || '').replace(/([a-z])([A-Z])/g, '$1 $2'); }, nav: 'rpt',
    render: function (el, p) {

      var spec = RPT_FILTERS[id];
      if (!spec) { el.innerHTML = '<div class="empty">' + t('rep.soonHint') + '</div>'; return Promise.resolve(); }
      var opts = S.rptOptions ? Promise.resolve(S.rptOptions) : call('apiRptOptions').then(function (o) { S.rptOptions = o; return o; });
      return opts.then(function (o) {
        var f = Object.assign({ dateFrom: U.today(), dateTo: U.today() }, p.f || {});
        var sel = {};
        var html = '<div class="list-head"><h2 class="list-title">' + icon('chart') + ' ' + esc(id.replace(/([a-z])([A-Z])/g, '$1 $2')) + '</h2></div>' +
          '<div class="card no-print rpt-filters"><div class="rpt-grid" id="rpF">';
        spec.forEach(function (s) {
          if (Array.isArray(s) && s[0] === 'date') {
            html += rfield(t('rf.dateFrom'), '<input class="input" type="date" name="dateFrom" value="' + esc(f.dateFrom) + '">') +
              rfield(t('rf.dateTo'), '<input class="input" type="date" name="dateTo" value="' + esc(f.dateTo) + '">');
          } else if (Array.isArray(s) && s[0] === 'text') {
            html += rfield(t('rf.' + s[1]), '<input class="input" name="' + s[1] + '" value="' + esc(f[s[1]] || '') + '" placeholder="' + esc(t('rf.anyText')) + '">');
          } else if (Array.isArray(s) && s[0] === 'yn') {
            html += rfield(t('rf.' + s[1]), U.selectH(s[1], [{ v: '', l: 'N/A' }, { v: 'Y', l: t('yes') }, { v: 'N', l: t('no') }], f[s[1]] || ''));
          } else {
            sel[s] = (f[s] || []).slice();
            html += rfield(t('rf.' + s), '<div class="msel" data-ms="' + s + '"><button class="input msel-box" type="button"><span class="msel-txt"></span><span class="msel-arr">▾</span></button></div>');
          }
        });
        html += '</div><div class="btn-row" style="margin-top:6px"><button class="btn btn-primary" id="rpRun" type="button">' + icon('search') + t('rep.run') + '</button>' +
          '<button class="btn" id="rpClear" type="button">' + t('cust.clear') + '</button></div></div><div id="rpOut"></div>';
        el.innerHTML = html;
        var showSel = function (name) {
          var box = $('[data-ms="' + name + '"] .msel-txt', el);
          var list = o[name] || [];
          var v = sel[name];
          box.textContent = !v.length ? t('rf.all') : list.filter(function (x) { return v.indexOf(x.v) >= 0; }).map(function (x) { return x.l; }).join(', ');
          box.title = box.textContent;
        };
        Object.keys(sel).forEach(showSel);
        $$('[data-ms]', el).forEach(function (w) {
          $('.msel-box', w).onclick = function (e) { e.stopPropagation(); openMsel(w, w.getAttribute('data-ms')); };
        });
        function openMsel(w, name) {
          closeMsel();
          var list = o[name] || [];
          var pop = document.createElement('div');
          pop.className = 'msel-pop';
          pop.innerHTML = '<input class="input sm" placeholder="' + esc(t('search')) + '"><div class="msel-acts"><a data-a="all">' + t('rf.selectAll') + '</a> · <a data-a="none">' +
            t('rf.clearSel') + '</a></div><div class="msel-list"></div>';
          w.appendChild(pop);
          var draw = function () {
            var q = $('input', pop).value.trim().toLowerCase();
            var hit = list.filter(function (x) { return !q || x.l.toLowerCase().indexOf(q) >= 0; });
            // รายการที่เลือกไว้แสดงก่อน
            hit.sort(function (a, b) { return (sel[name].indexOf(b.v) >= 0) - (sel[name].indexOf(a.v) >= 0); });
            $('.msel-list', pop).innerHTML = hit.slice(0, 300).map(function (x) {
              return '<label class="check small"><input type="checkbox" value="' + esc(x.v) + '"' + (sel[name].indexOf(x.v) >= 0 ? ' checked' : '') + '>' + esc(x.l) + '</label>';
            }).join('') + (hit.length > 300 ? '<div class="muted small">' + t('rf.more', { n: hit.length - 300 }) + '</div>' : '') +
              (hit.length ? '' : '<div class="muted small">' + t('noData') + '</div>');
            $$('.msel-list input', pop).forEach(function (cb) {
              cb.onchange = function () {
                if (cb.checked) { if (sel[name].indexOf(cb.value) < 0) sel[name].push(cb.value); }
                else sel[name] = sel[name].filter(function (v) { return v !== cb.value; });
                showSel(name);
              };
            });
          };
          $('input', pop).oninput = draw;
          $('[data-a=all]', pop).onclick = function () {
            var q = $('input', pop).value.trim().toLowerCase();
            list.forEach(function (x) { if ((!q || x.l.toLowerCase().indexOf(q) >= 0) && sel[name].indexOf(x.v) < 0) sel[name].push(x.v); });
            showSel(name); draw();
          };
          $('[data-a=none]', pop).onclick = function () { sel[name] = []; showSel(name); draw(); };
          pop.onclick = function (e) { e.stopPropagation(); };
          draw();
          setTimeout(function () { $('input', pop).focus(); }, 30);
        }
        function closeMsel() { $$('.msel-pop', el).forEach(function (x) { x.remove(); }); }
        el.addEventListener('click', closeMsel);
        var readF = function () {

        var run = function () {

          return call('apiRptRun', id, nf).then(function (r) { drawRpt(r, o, nf); });
        };
        $('#rpRun').onclick = function () { run().catch(function () {}); };

      function rfield(label, inner) { return '<label class="rf"><span>' + esc(label) + '</span>' + inner + '</label>'; }
    }
  };

  /** แสดงผลรายงาน: หัวรายงาน + ตารางแบ่งกลุ่ม (กดยุบ/ขยาย) + ยอดรวมกลุ่ม + ยอดรวมทั้งหมด */
  function drawRpt(r, o, f) {
    var cols = r.columns;
    var isNum = function (c) { return ['money', 'qty', 'num', 'pct'].indexOf(c.type) >= 0; };
    var fmt = function (v, c) {
      if (c.type === 'date') return U.dateFmt(v);
      if (c.type === 'money') return money(v);
      if (c.type === 'qty' || c.type === 'num') return U.qtyFmt(v);
      return esc(v === undefined || v === null ? '' : v);
    };
    var headLines = [[t('rf.dateFrom'), U.dateFmt(f.dateFrom)], [t('rf.dateTo'), U.dateFmt(f.dateTo)]];
    (RPT_FILTERS[r.id] || []).forEach(function (s) {
      if (Array.isArray(s) && s[0] === 'date') return;
      var k = Array.isArray(s) ? s[1] : s;
      var v = f[k];
      var txt = Array.isArray(v) ? (v.length ? (o[k] || []).filter(function (x) { return v.indexOf(x.v) >= 0; }).map(function (x) { return x.l; }).join(', ') : 'ALL')
                                 : (v ? (Array.isArray(s) && s[0] === 'yn' ? (v === 'Y' ? t('yes') : t('no')) : v) : (Array.isArray(s) && s[0] === 'yn' ? 'N/A' : ''));
      headLines.push([t('rf.' + k), txt]);
    });
    // จัดกลุ่ม
    var groups = [], gm = {};
    r.rows.forEach(function (row) {
      var k = r.groupBy ? row[r.groupBy] : '';
      if (!gm[k]) { gm[k] = { key: k, label: r.groupLabel ? row[r.groupLabel] : '', rows: [], sum: {} }; groups.push(gm[k]); }
      gm[k].rows.push(row);
      cols.forEach(function (c) { if (r.totals && r.totals[c.key] !== undefined) gm[k].sum[c.key] = r2((gm[k].sum[c.key] || 0) + num(row[c.key])); });
    });
    var sumable = function (c) { return r.totals && r.totals[c.key] !== undefined; };
    var flat = [];         // สำหรับ Excel / CSV / พิมพ์
    groups.forEach(function (g) {
      if (r.groupBy) flat.push({ kind: 'group', cells: cols.map(function (c, i) { return i === 0 ? g.key + ' ' + g.label + ' (' + g.rows.length + ')' : ''; }) });
      g.rows.forEach(function (row) { flat.push({ kind: '', cells: cols.map(function (c) { return c.type === 'date' ? U.dateFmt(row[c.key]) : row[c.key]; }) }); });
      if (r.groupBy) flat.push({ kind: 'sub', cells: cols.map(function (c, i) { return i === 0 ? t('rpt.subtotal') + ' ' + g.key : (sumable(c) ? g.sum[c.key] : ''); }) });
    });
    if (r.rows.length) flat.push({ kind: 'total', cells: cols.map(function (c, i) { return i === 0 ? t('rpt.grand') : (sumable(c) ? r.totals[c.key] : ''); }) });

    var shown = 0;
    var body = groups.map(function (g, gi) {
      var h = r.groupBy ? '<tr class="rpt-grp" data-g="' + gi + '"><td colspan="' + cols.length + '"><span class="rpt-tg">⊟</span> <b>' + esc(g.key) + '</b> ' + esc(g.label) +
        ' <span class="muted small">(' + g.rows.length + ')</span></td></tr>' : '';
      h += g.rows.map(function (row) {
        if (shown++ >= RPT_ROW_LIMIT) return '';
        return '<tr class="rpt-row g' + gi + '">' + cols.map(function (c) { return '<td class="' + (isNum(c) ? 'num' : '') + '">' + fmt(row[c.key], c) + '</td>'; }).join('') + '</tr>';
      }).join('');
      if (r.groupBy) h += '<tr class="rpt-sub g' + gi + '">' + cols.map(function (c, i) {
        return '<td class="' + (isNum(c) ? 'num' : '') + '">' + (i === 0 ? t('rpt.subtotal') : (sumable(c) ? fmt(g.sum[c.key], c) : '')) + '</td>';
      }).join('') + '</tr>';
      return h;
    }).join('');
    var foot = r.rows.length ? '<tr class="rpt-total">' + cols.map(function (c, i) { return '<td class="' + (isNum(c) ? 'num' : '') + '">' + (i === 0 ? t('rpt.grand') : (sumable(c) ? fmt(r.totals[c.key], c) : '')) + '</td>'; }).join('') + '</tr>' : '';
    var canExport = !!U.can('report.export') || !!U.can('report.sales');
    $('#rpOut').innerHTML = '<div class="card"><div class="rpt-bar no-print"><div class="btn-row">' +
      (canExport ? '<button class="btn btn-sm" id="rpXlsx" type="button">' + icon('download') + 'Excel</button><button class="btn btn-sm" id="rpCsv" type="button">' + icon('download') + 'CSV</button>' : '') +
      '<button class="btn btn-sm" id="rpPrint" type="button">' + icon('print') + t('rpt.printPdf') + '</button></div>' +
      '<div class="input-group" style="max-width:260px"><input class="input sm" id="rpFind" placeholder="' + esc(t('rpt.find')) + '"></div></div>' +
      '<div class="rpt-head"><h3>' + esc(r.title) + '</h3><div class="rpt-meta">' + headLines.map(function (h) {
        return '<div><span>' + esc(h[0]) + ':</span> ' + esc(h[1]) + '</div>';
      }).join('') + '</div></div>' +
      (r.rows.length > RPT_ROW_LIMIT ? '<div class="alert warn">' + t('rpt.tooMany', { n: RPT_ROW_LIMIT, all: r.rows.length }) + '</div>' : '') +
      (r.rows.length ? '<div class="table-wrap rpt-wrap"><table class="tbl rpt-tbl"><thead><tr>' + cols.map(function (c) {
        return '<th class="' + (isNum(c) ? 'num' : '') + '">' + esc(c.label) + '</th>';
      }).join('') + '</tr></thead><tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot></table></div>' : '<div class="empty">' + t('noData') + '</div>') +
      '<div class="muted small" style="margin-top:8px">' + t('pager.total', { n: r.rows.length }) + ' · ' + t('rpt.printedAt') + ' ' + esc(U.dateFmt(r.printedAt)) + '</div></div>';
    $$('.rpt-grp', $('#rpOut')).forEach(function (tr) {
      tr.onclick = function () {
        var gi = tr.getAttribute('data-g'), open = tr.classList.toggle('closed');
        $('.rpt-tg', tr).textContent = open ? '⊞' : '⊟';
        $$('.rpt-row.g' + gi, $('#rpOut')).forEach(function (x) { x.classList.toggle('hidden', open); });
      };
    });
    if ($('#rpFind')) $('#rpFind').oninput = U.debounce(function () {
      var q = $('#rpFind').value.trim().toLowerCase();
      $$('.rpt-row', $('#rpOut')).forEach(function (tr) { tr.classList.toggle('hidden', !!q && tr.textContent.toLowerCase().indexOf(q) < 0); });
    }, 250);
    var fname = r.id + '_' + f.dateFrom + '_' + f.dateTo;
    if ($('#rpXlsx')) $('#rpXlsx').onclick = function () {
      U.downloadXlsx(fname + '.xlsx', r.title, headLines, cols, flat.map(function (x) { return x.cells; }), function (i) { return flat[i].kind; });
    };
    if ($('#rpCsv')) $('#rpCsv').onclick = function () {
      U.downloadCsv(fname + '.csv', cols.map(function (c) { return c.label; }), r.rows.map(function (row) { return cols.map(function (c) { return row[c.key]; }); }));
    };
    $('#rpPrint').onclick = function () {
      var html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(r.title) + '</title><style>@page{size:A4 landscape;margin:8mm}' +
        'body{font-family:Tahoma,"Noto Sans Thai",sans-serif;font-size:9px;color:#222}h2{margin:0;font-size:14px}h3{margin:2px 0 6px;font-size:12px}' +
        '.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:1px 16px;margin-bottom:8px}.meta span{color:#666}' +
        'table{width:100%;border-collapse:collapse}th{border-bottom:1.5px solid #333;text-align:left;padding:3px;vertical-align:bottom}td{border-bottom:1px solid #ddd;padding:2px 3px;vertical-align:top}' +
        '.n{text-align:right;white-space:nowrap}tr.group td{background:#f3eae0;font-weight:bold}tr.sub td,tr.total td{font-weight:bold;border-top:1px solid #999}tr.total td{border-top:2px solid #333}</style></head><body>' +
        '<h2>' + esc(r.company || '') + '</h2><h3>' + esc(r.title) + '</h3><div class="meta">' + headLines.map(function (h) { return '<div><span>' + esc(h[0]) + ':</span> ' + esc(h[1]) + '</div>'; }).join('') +
        '</div><table><thead><tr>' + cols.map(function (c) { return '<th class="' + (isNum(c) ? 'n' : '') + '">' + esc(c.label) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        flat.map(function (x) {
          if (x.kind === 'group') return '<tr class="group"><td colspan="' + cols.length + '">' + esc(x.cells[0]) + '</td></tr>';
          return '<tr class="' + x.kind + '">' + x.cells.map(function (v, i) { return '<td class="' + (isNum(cols[i]) ? 'n' : '') + '">' + ((i === 0 && x.kind) || cols[i].type === 'date' ? esc(v) : fmt(v, cols[i])) + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table><p style="color:#666">' + t('rpt.printedAt') + ' ' + esc(U.dateFmt(r.printedAt)) + '</p></body></html>';
      U.printHtml(html);
    };
  }

            (type === 'PRICE_GROUP' ? '<div class="alert info">' + t('lk.priceGroupHint') + '</div>' : '') +
            '<div class="card">' + U.table([{ key: 'Code', label: t('f.Code') }, { key: 'NameTh', label: t('f.NameTh') }, { key: 'NameEn', label: t('f.NameEn') }]
              .concat(type === 'PRICE_GROUP' ? [{ key: 'Extra', label: t('f.TierTable'), fmt: function (r) { return esc(r.Extra ? t('ch.' + r.Extra) : ''); } }] : [])
              .concat([{ key: 'SortOrder', label: t('f.SortOrder'), type: 'num' }, { key: 'Active', label: t('f.Status'), fmt: function (r) { return stBadge(yesNo(r.Active) ? 'ACTIVE' : 'INACTIVE'); } }]),
              rows, { onRow: lkForm }) + '</div>';
          bindTabs();
          $('#lkType').onchange = function () { go('masters', { tab: 'lk', type: this.value }, true); };
          $('#lkNew').onclick = function () { lkForm(null); };
          function lkForm(r) {
            var isNew = !r;
            r = r || { Type: type, Active: 'TRUE', SortOrder: rows.length + 1, Extra: type === 'PRICE_GROUP' ? 'PRE' : '' };
            var m = modal({ title: t('lk.' + type),
              body: U.field(t('f.Code'), U.inputH('Code', r.Code, isNew ? '' : 'readonly'), true) + U.field(t('f.NameTh'), U.inputH('NameTh', r.NameTh)) +
                U.field(t('f.NameEn'), U.inputH('NameEn', r.NameEn)) +
                (type === 'PRICE_GROUP' ? U.field(t('f.TierTable'), U.selectH('Extra', [{ v: 'PRE', l: t('ch.PRE') }, { v: 'VAN', l: t('ch.VAN') }], r.Extra)) : '') +
                U.field(t('f.SortOrder'), U.inputH('SortOrder', r.SortOrder, 'type="number"')) +
                '<label class="check"><input type="checkbox" name="Active"' + (yesNo(r.Active) ? ' checked' : '') + '>' + t('st.ACTIVE') + '</label>',
              foot: '<button class="btn btn-primary" data-s type="button">' + t('save') + '</button>' });
            $('[data-s]', m.el).onclick = function () {
              var x = U.formData(m.el);
              x.Type = type;
              call('apiLookupSave', x).then(function () { m.close(); return reloadLookups(); }).then(function () { toast(t('saved'), 'ok'); U.refresh(); }).catch(noop);
            };
          }
        });
      }
      return Promise.all([call('apiDocTypeList'), call('apiUserList')]).then(function (res) {
        var list = res[0], users = res[1];
        el.innerHTML = head + '<div class="btn-row" style="margin-bottom:12px"><button class="btn btn-primary" id="dNew" type="button">' + icon('plus') + t('mst.newDocType') + '</button></div><div class="card">' +
          U.table([{ key: 'DocType', label: t('f.DocType') }, { key: 'NameTh', label: t('f.Name'), fmt: function (d) { return esc(L(d.NameTh, d.NameEn)); } },
                   { key: 'rules', label: t('mst.approvalSteps'), fmt: function (d) { return d.rules.length ? d.rules.map(function (x) { return x.Step + '. ' + esc(x.ApproverUserId ? x.ApproverUserId : roleName(x.ApproverRole)); }).join('<br>') : '<span class="muted">' + t('mst.noApproval') + '</span>'; } },
                   { key: 'Active', label: t('f.Status'), fmt: function (d) { return stBadge(yesNo(d.Active) ? 'ACTIVE' : 'INACTIVE'); } }], list, { onRow: dtForm }) + '</div>';
        bindTabs();
        $('#dNew').onclick = function () { dtForm(null); };
        function dtForm(d) {
          var isNew = !d;
          d = d || { PartyType: 'NONE', RequiresApproval: 'FALSE', Active: 'TRUE', IsSystem: 'FALSE', rules: [] };
          var sys = yesNo(d.IsSystem);
          var steps = d.rules.map(function (x) { return { ApproverRole: x.ApproverRole, ApproverUserId: x.ApproverUserId }; });
          var m = modal({ title: d.DocType || t('mst.newDocType'), wide: true,
            body: '<div class="grid grid-2" id="df">' + U.field(t('f.DocType'), U.inputH('DocType', d.DocType, isNew ? 'maxlength="6" style="text-transform:uppercase"' : 'readonly'), true) +
              U.field(t('f.Prefix'), U.inputH('Prefix', d.Prefix, isNew ? 'maxlength="6"' : 'readonly')) +
              U.field(t('f.NameTh'), U.inputH('NameTh', d.NameTh), true) + U.field(t('f.NameEn'), U.inputH('NameEn', d.NameEn)) +
              (sys ? '' : U.field(t('f.PartyType'), U.selectH('PartyType', [{ v: 'NONE', l: '-' }, { v: 'C', l: t('f.Customer') }, { v: 'S', l: t('f.Supplier') }], d.PartyType))) +
              (sys ? '' : '<label class="check"><input type="checkbox" name="Active"' + (yesNo(d.Active) ? ' checked' : '') + '>' + t('st.ACTIVE') + '</label>') + '</div>' +
              (isNew ? '<p class="muted small">' + t('mst.docTypeHint') + '</p>' : '<h4>' + t('mst.approvalSteps') + '</h4><div id="stepBox"></div><button class="btn btn-sm" id="stAdd" type="button">' + icon('plus') + t('mst.addStep') + '</button>'),
            foot: (!isNew ? '<button class="btn" data-rules type="button">' + t('mst.saveSteps') + '</button>' : '') + '<button class="btn btn-primary" data-s type="button">' + t('save') + '</button>' });
          var drawSteps = function () {
            var box = $('#stepBox', m.el);
            if (!box) return;
            box.innerHTML = steps.length ? steps.map(function (s, i) {
              return '<div class="input-group" style="margin-bottom:6px"><span style="align-self:center">' + (i + 1) + '.</span>' +
                '<select class="input" data-sr="' + i + '">' + (S.lookups.roles || []).map(function (r) { return '<option value="' + esc(r.code) + '"' + (r.code === s.ApproverRole ? ' selected' : '') + '>' + esc(L(r.nameTh, r.nameEn)) + '</option>'; }).join('') + '</select>' +
                '<select class="input" data-su="' + i + '"><option value="">' + t('mst.anyInRole') + '</option>' + users.filter(function (u) { return yesNo(u.Active); }).map(function (u) {
                  return '<option value="' + esc(u.UserId) + '"' + (u.UserId === s.ApproverUserId ? ' selected' : '') + '>' + esc(u.FullName) + '</option>';
                }).join('') + '</select><button class="btn" type="button" data-sd="' + i + '">' + icon('x') + '</button></div>';
            }).join('') : '<div class="muted small">' + t('mst.noApproval') + '</div>';
            $$('[data-sr]', box).forEach(function (s) { s.onchange = function () { steps[Number(s.getAttribute('data-sr'))].ApproverRole = s.value; }; });
            $$('[data-su]', box).forEach(function (s) { s.onchange = function () { steps[Number(s.getAttribute('data-su'))].ApproverUserId = s.value; }; });
            $$('[data-sd]', box).forEach(function (b) { b.onclick = function () { steps.splice(Number(b.getAttribute('data-sd')), 1); drawSteps(); }; });
          };
          drawSteps();
          if ($('#stAdd', m.el)) $('#stAdd', m.el).onclick = function () { steps.push({ ApproverRole: 'ACC', ApproverUserId: '' }); drawSteps(); };
          $('[data-s]', m.el).onclick = function () {
            var x = U.formData($('#df', m.el));
            x.RequiresApproval = isNew ? false : steps.length > 0;
            if (sys) { x.Active = true; x.PartyType = d.PartyType; }
            call('apiDocTypeSave', x).then(function () { m.close(); return reloadLookups(); }).then(function () { toast(t('saved'), 'ok'); U.refresh(); }).catch(noop);
          };
          if ($('[data-rules]', m.el)) $('[data-rules]', m.el).onclick = function () {
            call('apiApprovalRulesSave', d.DocType, steps).then(function () { m.close(); return reloadLookups(); }).then(function () { toast(t('saved'), 'ok'); U.refresh(); }).catch(noop);
          };
        }
      });
    }
  };

  // ===============================================================
  //  Audit Log
  // ===============================================================
  R.audit = {
    title: 'menu.audit',
    render: function (el, p) {
      var f = Object.assign({ page: 1 }, p);
      el.innerHTML = '<div class="card no-print"><div class="toolbar"><div class="grow">' + U.field(t('search'), '<input class="input" id="aq" value="' + esc(f.q || '') + '">') + '</div>' +
        U.field(t('f.dateFrom'), '<input class="input" type="date" id="aF" value="' + esc(f.dateFrom || '') + '">') +
        U.field(t('f.dateTo'), '<input class="input" type="date" id="aT" value="' + esc(f.dateTo || '') + '">') + '</div></div><div id="aRes"></div>';
      var reload = function (page) {
        return call('apiAuditList', { q: $('#aq').value.trim(), dateFrom: $('#aF').value, dateTo: $('#aT').value, page: page || 1 }).then(function (r) {
          $('#aRes').innerHTML = '<div class="card">' + U.table([
            { key: 'Timestamp', label: t('f.Time'), type: 'date' }, { key: 'UserEmail', label: t('f.User') },
            { key: 'Action', label: t('f.Action'), fmt: function (l) { var x = t('act.' + l.Action); return esc(x.indexOf('act.') === 0 ? l.Action : x); } },
            { key: 'EntityType', label: t('f.Entity'), fmt: function (l) { return esc(l.EntityType) + ' ' + esc(l.EntityId); } },
            { key: 'Detail', label: t('f.Detail'), fmt: function (l) { return '<span class="small muted" style="word-break:break-all">' + esc(String(l.Detail).slice(0, 160)) + '</span>'; } }
          ], r.items) + U.pager(r, reload) + '</div>';
        });
      };
      $('#aq').oninput = U.debounce(function () { reload(1).catch(noop); }, 400);
      $('#aF').onchange = $('#aT').onchange = function () { reload(1).catch(noop); };
      return reload(f.page);
    }
  };

  // ===============================================================
  //  โปรไฟล์
  // ===============================================================
  R.profile = {
    title: 'menu.profile',
    render: function (el) {
      var u = S.boot.user;
      el.innerHTML = '<div class="card"><div class="kv">' + [['f.FullName', u.FullName], ['f.Email', u.Email], ['f.RoleCode', L(u.RoleNameTh, u.RoleNameEn)],
        ['f.SalesRepId', U.repName(u.SalesRepId)], ['f.VanWarehouseId', u.VanName], ['f.LastLogin', U.dateFmt(u.LastLogin)]].map(function (k) {
          return k[1] ? '<div><div class="k">' + t(k[0]) + '</div><div class="v">' + esc(k[1]) + '</div></div>' : '';
        }).join('') + '</div></div><div class="card"><div class="btn-row">' +
        '<button class="btn" id="prLang" type="button">' + (S.lang === 'th' ? 'English' : 'ภาษาไทย') + '</button>' +
        '<button class="btn" id="prPwd" type="button">' + icon('shield') + t('pwd.title') + '</button>' +
        '<button class="btn btn-danger" id="prOut" type="button">' + icon('logout') + t('logout') + '</button></div></div>' +
        '<div class="card"><h4>' + t('prof.install') + '</h4><p class="muted small">' + t('prof.installHint') + '</p></div>' +
        '<p class="muted small center">v' + esc((window.APP_META || {}).version || '') + '</p>';
      $('#prLang').onclick = function () { U.setLang(S.lang === 'th' ? 'en' : 'th'); };
      $('#prPwd').onclick = function () { U.showChangePassword(false); };
      $('#prOut').onclick = function () { U.confirmBox(t('logout.confirm')).then(function (ok) { if (ok) U.doLogout(); }); };
      return Promise.resolve();
    }
  };
})(window.__U);
</script>
