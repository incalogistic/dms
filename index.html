<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>DMS</title>
  <meta charset="utf-8">
  <!-- ============================================================
       Index.html — โครงหน้าเว็บ (ไฟล์ชนิด HTML)
       รวมไฟล์ Styles / I18n / App เข้ามาด้วย include()
       โหลดจาก CDN: Google Fonts, Chart.js, html5-qrcode (สแกนบาร์โค้ด)
       ============================================================ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* ============================================================
   Styles.html — ธีมขาว–น้ำตาล มินิมอล (ไฟล์ชนิด HTML)
   มือถือ: เมนูด้านล่าง + เมนูเลื่อนจากซ้าย / คอมพิวเตอร์: แถบเมนูด้านข้าง
   ============================================================ */
:root {
  --bg: #FAF7F2;
  --surface: #FFFFFF;
  --primary: #8B5E3C;
  --primary-dark: #5C3D2E;
  --primary-soft: #F3EAE0;
  --border: #E8DFD3;
  --text: #3B2F2A;
  --muted: #8A7B70;
  --ok: #3F7D4E;
  --ok-soft: #E6F2E8;
  --warn: #B7791F;
  --warn-soft: #FBF1DC;
  --danger: #B5413B;
  --danger-soft: #F8E4E2;
  --info: #3D6A8C;
  --info-soft: #E3EDF5;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(59, 47, 42, .06), 0 2px 8px rgba(59, 47, 42, .05);
  --sidebar-w: 248px;
  --topbar-h: 56px;
  --bottomnav-h: 62px;
  --font: 'Noto Sans Thai', 'Sarabun', Tahoma, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5; }
body { -webkit-text-size-adjust: 100%; overflow-x: hidden; }
a { color: var(--primary); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0 0 .5em; color: var(--primary-dark); font-weight: 600; line-height: 1.3; }
h2 { font-size: 1.25rem; } h3 { font-size: 1.08rem; } h4 { font-size: .98rem; }
p { margin: 0 0 .6em; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.chart-off { padding: 40px 12px; text-align: center; }
.small { font-size: .85rem; }
.right { text-align: right; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.mono { font-variant-numeric: tabular-nums; }
.strong { font-weight: 600; }
.gap { height: 12px; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
svg.ic { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; vertical-align: middle; }
.btn svg.ic { width: 18px; height: 18px; }

/* ---------- แถบโหลด ---------- */
.loadbar { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--primary); z-index: 9999; transition: width .3s, opacity .3s; opacity: 0; }
.loadbar.on { width: 70%; opacity: 1; transition: width 8s cubic-bezier(.1,.6,.2,1); }

/* ---------- หน้าเริ่ม / ล็อกอิน ---------- */
.splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.splash-logo { font-size: 2rem; font-weight: 700; color: var(--primary); letter-spacing: 2px; }
.auth { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.auth-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 28px 24px; }
.auth-card .logo { text-align: center; margin-bottom: 16px; }
.auth-card .logo img { max-height: 64px; max-width: 200px; }
.auth-card .logo .name { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
.auth-card .logo .company { color: var(--muted); font-size: .9rem; }
.auth-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }

/* ---------- โครงหลัก ---------- */
.shell { display: flex; min-height: 100vh; }
.sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); position: fixed; top: 0; bottom: 0; left: 0; overflow-y: auto; z-index: 40; display: flex; flex-direction: column; }
.sidebar .brand { padding: 16px 18px; border-bottom: 1px solid var(--border); }
.sidebar .brand .name { font-weight: 700; color: var(--primary); font-size: 1.15rem; }
.sidebar .brand .user { font-size: .85rem; color: var(--muted); margin-top: 2px; }
.nav-group { padding: 8px 0; }
.nav-group-title { padding: 8px 18px 4px; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 9px 18px; color: var(--text); cursor: pointer; border-left: 3px solid transparent; user-select: none; }
.nav-item:hover { background: var(--primary-soft); text-decoration: none; }
.nav-item.active { background: var(--primary-soft); border-left-color: var(--primary); color: var(--primary-dark); font-weight: 600; }
.nav-dd { padding: 2px 0; }
.nav-dd-head .chev { margin-left: auto; width: 16px; height: 16px; transition: transform .2s; color: var(--muted); }
.nav-dd.open .nav-dd-head .chev { transform: rotate(180deg); }
.nav-dd .nav-sub { display: none; padding-bottom: 4px; }
.nav-dd.open .nav-sub { display: block; }
.nav-dd.open .nav-dd-head { color: var(--primary-dark); font-weight: 600; }
.nav-subitem { padding: 7px 18px 7px 50px; font-size: .92rem; }
.nav-sub-title { padding: 8px 18px 2px 50px; font-size: .72rem; color: var(--muted); letter-spacing: .3px; }
.nav-subitem.soon { color: var(--muted); }
.soon-tag { white-space: nowrap; margin-left: auto; font-size: .66rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0 6px; }
.nav-item .count { margin-left: auto; background: var(--danger); color: #fff; border-radius: 10px; font-size: .72rem; padding: 0 7px; line-height: 18px; }
.main { flex: 1; margin-left: var(--sidebar-w); min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 30; height: var(--topbar-h); background: rgba(250, 247, 242, .95); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; padding: 0 16px; }
.page-title { font-size: 1.1rem; font-weight: 600; color: var(--primary-dark); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn { border: 0; background: transparent; color: var(--primary-dark); width: 40px; height: 40px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; position: relative; font-family: var(--font); }
.icon-btn:hover { background: var(--primary-soft); }
.lang-btn { font-weight: 700; font-size: .85rem; width: auto; padding: 0 10px; }
.bell-count { position: absolute; top: 3px; right: 3px; background: var(--danger); color: #fff; border-radius: 9px; font-size: .68rem; min-width: 18px; height: 18px; line-height: 18px; text-align: center; padding: 0 4px; }
.content { padding: 20px; max-width: 1280px; width: 100%; margin: 0 auto; }
.bottomnav { display: none; }
.drawer-mask { position: fixed; inset: 0; background: rgba(59, 47, 42, .35); z-index: 35; }
.only-mobile { display: none !important; }

/* ---------- การ์ด / กริด ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
.card-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.card-title h3 { margin: 0; }
.grid { display: grid; gap: 12px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); cursor: default; }
.kpi.click { cursor: pointer; }
.kpi .label { color: var(--muted); font-size: .85rem; }
.kpi .value { font-size: 1.45rem; font-weight: 700; color: var(--primary-dark); font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: .8rem; color: var(--muted); }
.kpi.warn .value { color: var(--warn); } .kpi.danger .value { color: var(--danger); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 12px; }
.toolbar .grow { flex: 1; min-width: 160px; }
.spacer { flex: 1; }
.chart-box { position: relative; height: 260px; }

/* ---------- ฟอร์ม ---------- */
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; min-width: 0; }
.field > span { font-size: .85rem; color: var(--muted); }
.field > span .req { color: var(--danger); }
.input, select.input, textarea.input { width: 100%; font-family: var(--font); font-size: 15px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 11px; outline: none; min-height: 42px; }
textarea.input { min-height: 72px; resize: vertical; }
.input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139, 94, 60, .15); }
.input[readonly], .input:disabled { background: var(--bg); color: var(--muted); }
.input.num { text-align: right; font-variant-numeric: tabular-nums; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.check input { width: 18px; height: 18px; accent-color: var(--primary); }
.input-group { display: flex; gap: 6px; }
.input-group .input { flex: 1; }
.form-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 8px; }

/* ---------- ปุ่ม ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--primary-dark); border-radius: var(--radius-sm); padding: 8px 14px; font-family: var(--font); font-size: 15px; font-weight: 500; cursor: pointer; min-height: 42px; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--primary-soft); text-decoration: none; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-ok { background: var(--ok); border-color: var(--ok); color: #fff; } .btn-ok:hover { background: #2f6340; }
.btn-danger { background: var(--surface); border-color: var(--danger); color: var(--danger); } .btn-danger:hover { background: var(--danger-soft); }
.btn-warn { border-color: var(--warn); color: var(--warn); } .btn-warn:hover { background: var(--warn-soft); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-sm { min-height: 34px; padding: 5px 10px; font-size: 14px; }
.btn-block { width: 100%; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- ตาราง ---------- */
.table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .92rem; }
.tbl th { text-align: left; font-weight: 600; color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .3px; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface); }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--primary-soft); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tfoot td { font-weight: 700; background: var(--bg); }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

/* ---------- ป้ายสถานะ ---------- */
.badge { display: inline-block; padding: 1px 9px; border-radius: 20px; font-size: .78rem; font-weight: 600; white-space: nowrap; background: var(--primary-soft); color: var(--primary-dark); }
.badge.DRAFT { background: #EEE9E3; color: #6B5E55; }
.badge.PENDING { background: var(--warn-soft); color: var(--warn); }
.badge.APPROVED, .badge.PAID, .badge.OK, .badge.ACTIVE, .badge.FULL { background: var(--ok-soft); color: var(--ok); }
.badge.REJECTED, .badge.CANCELLED, .badge.ISSUE, .badge.INACTIVE, .badge.DISCONTINUED { background: var(--danger-soft); color: var(--danger); }
.badge.RETURNED, .badge.UNPAID, .badge.PARTIAL { background: var(--info-soft); color: var(--info); }
.badge.type { background: var(--primary); color: #fff; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 14px; border: 1px solid var(--border); font-size: .82rem; background: var(--surface); margin: 2px; }
.chip button { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 0 2px; font-size: 1rem; line-height: 1; }

/* ---------- แท็บ ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; overflow-x: auto; }
.tab { padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); white-space: nowrap; user-select: none; }
.tab.active { border-bottom-color: var(--primary); color: var(--primary-dark); font-weight: 600; }

/* ---------- รายการแบบการ์ด (มือถือ) ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
.list-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
.list-item:hover { border-color: var(--primary); }
.list-item .main-col { flex: 1; min-width: 0; }
.list-item .title { font-weight: 600; }
.list-item .meta { font-size: .85rem; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 32px 12px; }

/* ---------- บรรทัดสินค้าในเอกสาร ---------- */
.line { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; background: var(--surface); }
.line-head { display: flex; gap: 8px; align-items: flex-start; }
.line-head .name { flex: 1; font-weight: 600; min-width: 0; }
.line-head .code { font-size: .8rem; color: var(--muted); font-weight: 400; }
.line-body { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-top: 8px; }
.line-body .field { margin: 0; }
.line-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: .88rem; flex-wrap: wrap; }
.qty { display: inline-flex; align-items: stretch; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; height: 42px; }
.qty button { width: 42px; border: 0; background: var(--primary-soft); color: var(--primary-dark); font-size: 1.3rem; cursor: pointer; font-family: var(--font); }
.qty input { width: 70px; border: 0; text-align: center; font-size: 16px; font-family: var(--font); color: var(--text); outline: none; }
.stock-ok { color: var(--ok); } .stock-low { color: var(--danger); font-weight: 600; }
.tier-box { border: 1px dashed var(--primary); border-radius: var(--radius); padding: 10px 12px; background: var(--primary-soft); margin-bottom: 12px; font-size: .9rem; }
.tier-box .grp { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; flex-wrap: wrap; }
.tier-hint { color: var(--warn); font-size: .85rem; }
.totals { margin-left: auto; max-width: 380px; width: 100%; }
.totals .row { display: flex; justify-content: space-between; padding: 4px 0; font-variant-numeric: tabular-nums; }
.totals .row.grand { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 8px; font-weight: 700; font-size: 1.12rem; color: var(--primary-dark); }

/* ---------- ค้นหาสินค้า ---------- */
.search-box { position: relative; }
.suggest { position: absolute; left: 0; right: 0; top: 100%; z-index: 25; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow); max-height: 320px; overflow-y: auto; margin-top: 4px; }
.suggest .opt { padding: 9px 12px; cursor: pointer; border-bottom: 1px solid var(--border); }
.suggest .opt:last-child { border-bottom: 0; }
.suggest .opt:hover, .suggest .opt.hl { background: var(--primary-soft); }

/* ---------- ข้อมูลเอกสาร ---------- */
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 16px; }
.kv .k { font-size: .8rem; color: var(--muted); }
.kv .v { font-weight: 500; word-break: break-word; }
.doc-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.doc-head .no { font-size: 1.25rem; font-weight: 700; color: var(--primary-dark); }
.action-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { padding: 6px 0 6px 18px; border-left: 2px solid var(--border); position: relative; font-size: .9rem; }
.timeline li::before { content: ''; position: absolute; left: -6px; top: 12px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }

/* ---------- หน้าต่าง (modal) ---------- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(59, 47, 42, .45); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .15s; }
.modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 560px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
.modal.wide { max-width: 900px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.modal-head h3 { margin: 0; }
.modal-body { padding: 16px 18px; overflow-y: auto; }
.modal-foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
#scanBox { width: 100%; min-height: 260px; background: #000; border-radius: var(--radius-sm); overflow: hidden; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* ---------- แจ้งผล (toast) ---------- */
.toast-root { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 200; display: flex; flex-direction: column; gap: 8px; width: calc(100% - 32px); max-width: 440px; pointer-events: none; }
.toast { background: var(--primary-dark); color: #fff; padding: 11px 16px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.18); font-size: .93rem; animation: fade .2s; pointer-events: auto; }
.toast.ok { background: var(--ok); } .toast.err { background: var(--danger); } .toast.warn { background: var(--warn); }
.alert { padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 12px; font-size: .92rem; }
.alert.warn { background: var(--warn-soft); color: #7a5413; } .alert.err { background: var(--danger-soft); color: var(--danger); }
.alert.info { background: var(--info-soft); color: var(--info); } .alert.ok { background: var(--ok-soft); color: var(--ok); }

/* ---------- ตารางสิทธิ์ ---------- */
.perm-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.perm-row select { width: 120px; min-height: 36px; padding: 4px 8px; }

/* ---------- มือถือ ---------- */
@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); transition: transform .2s; box-shadow: 4px 0 20px rgba(0,0,0,.12); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .only-mobile { display: inline-flex !important; }
  .only-desktop { display: none !important; }
  .content { padding: 14px 12px calc(var(--bottomnav-h) + 20px); }
  .bottomnav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; height: var(--bottomnav-h); background: var(--surface); border-top: 1px solid var(--border); z-index: 30; padding-bottom: env(safe-area-inset-bottom); }
  .bottomnav .bn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .7rem; color: var(--muted); cursor: pointer; user-select: none; position: relative; }
  .bottomnav .bn.active { color: var(--primary); font-weight: 600; }
  .bottomnav .bn.primary svg.ic { background: var(--primary); color: #fff; border-radius: 50%; padding: 8px; width: 40px; height: 40px; margin-top: -14px; box-shadow: var(--shadow); }
  .bottomnav .bn .count { position: absolute; top: 4px; right: calc(50% - 22px); background: var(--danger); color: #fff; border-radius: 9px; font-size: .65rem; min-width: 16px; line-height: 16px; text-align: center; }
  .grid-3, .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-2.stack { grid-template-columns: 1fr; }
  .toast-root { bottom: calc(var(--bottomnav-h) + 14px); }
  .modal-backdrop { align-items: flex-end; padding: 0; }
  .modal, .modal.wide { max-width: 100%; border-radius: 16px 16px 0 0; max-height: 92vh; }
  /* ตารางแบบการ์ดบนมือถือ */
  table.tbl.cards thead { display: none; }
  table.tbl.cards, table.tbl.cards tbody, table.tbl.cards tr, table.tbl.cards td { display: block; width: 100%; }

  /** ใช้กับ promise ที่ไม่ต้องจัดการข้อผิดพลาดต่อ (แจ้งไปแล้ว) */
  function quiet(p) { return p.catch(function () { return undefined; }); }

  // ---------------------------------------------------------------
  //  ล็อกอิน / ออกจากระบบ / เปลี่ยนรหัสผ่าน

  function start() {
    S.lang = store.get('lang') || 'th';
    S.token = store.get('token');
    applyStatic();
    if (S.token) {
      // เปิดเร็ว: ถ้ามีข้อมูลรอบก่อนเก็บไว้ แสดงหน้าจอทันที แล้วค่อยตรวจกับ server เบื้องหลัง
      var cached = cacheRead('boot');
      if (cached && cacheRead('lookups')) {
        afterLogin(cached, true);
        run('apiMe', [S.token], true).then(function (boot) {
          var changed = JSON.stringify(boot.perms || {}) !== JSON.stringify(cached.perms || {}) || boot.user.RoleCode !== cached.user.RoleCode;
          S.boot = boot; cacheWrite('boot', boot); setUnread(boot.unread);
          if (boot.user.MustChangePwd || changed) afterLogin(boot);
        }).catch(function () { logoutLocal(); });
      } else {
        run('apiMe', [S.token]).then(function (boot) { afterLogin(boot); })
          .catch(function () { showLogin(); });
      }
    } else {
      showLogin();
    }
    if (window.google && google.script && google.script.history && google.script.history.setChangeHandler) {
      google.script.history.setChangeHandler(function (e) {
        if (e.state && e.state.name && S.boot) go(e.state.name, e.state.params || {}, true);
      });
    }
  }

      '<div class="name">' + esc(meta.appName || 'DMS') + '</div><div class="company">' + esc(meta.company || '') + '</div></div>' +

      '<label class="field"><span>' + t('f.Username') + '</span><input class="input" type="text" name="username" autocomplete="username" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase;letter-spacing:1px" required></label>' +
      '<label class="field"><span>' + t('f.Pin') + '</span><input class="input pin-input" type="password" name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="current-password" required></label>' +

      '<div class="auth-foot"><span class="muted small">v' + esc(meta.version || '') + '</span>' +
      '<button class="btn btn-ghost btn-sm" type="button" id="loginLang">' + (S.lang === 'th' ? 'English' : 'ภาษาไทย') + '</button></div></form>';
    var lastUser = store.get('username');
    if (lastUser) { $('[name=username]', box).value = lastUser; setTimeout(function () { var f = $('[name=pin]', box); if (f) f.focus(); }, 50); }
    $('[name=pin]', box).oninput = function () { this.value = this.value.replace(/\D/g, '').slice(0, 6); };
    $('#loginLang').onclick = function () { setLang(S.lang === 'th' ? 'en' : 'th', true); showLogin(); };
    $('#loginForm').onsubmit = function (e) {
      e.preventDefault();
      var uname = this.username.value.toUpperCase().replace(/[^A-Z0-9]/g, ''), pin = this.pin.value;

      btn.disabled = true;
      run('apiLogin', [uname, pin, 'WEB']).then(function (r) {

  function showChangePassword(forced) {
    var pinAttr = 'type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6"';
    var html = '<label class="field"><span>' + t('pwd.old') + '</span><input class="input pin-input" ' + pinAttr + ' id="pwOld" autocomplete="current-password"></label>' +

      '<label class="field"><span>' + t('pwd.confirm') + '</span><input class="input pin-input" ' + pinAttr + ' id="pwNew2" autocomplete="new-password"></label>' +
      '<p class="muted small">' + t('pwd.rule') + '</p>';
    var m = modal({
      title: forced ? t('pwd.forcedTitle') : t('pwd.title'), sticky: forced,
      body: (forced ? '<div class="alert info">' + t('pwd.forcedMsg') + '</div>' : '') + html,
      foot: (forced ? '<button class="btn" data-out type="button">' + t('logout') + '</button>' : '') +

    });
    $$('.pin-input', m.el).forEach(function (f) { f.oninput = function () { this.value = this.value.replace(/\D/g, '').slice(0, 6); }; });

      }).catch(function () { /* แจ้งแล้ว */ });

  function cacheRead(k) { try { return JSON.parse(store.get('c.' + k) || 'null'); } catch (e) { return null; } }
  function cacheWrite(k, v) { try { store.set('c.' + k, JSON.stringify(v)); } catch (e) { /* เต็ม → ข้าม */ } }
  function afterLogin(boot, fromCache) {
    S.boot = boot;
    if (!fromCache) cacheWrite('boot', boot);
    if (boot.user.Language && boot.user.Language !== S.lang) setLang(boot.user.Language, true);
    $('#splash').classList.add('hidden');
    if (boot.user.MustChangePwd) {
      $('#auth').classList.remove('hidden');
      $('#auth').innerHTML = '<div class="auth-card"><div class="logo"><div class="name">' + esc((window.APP_META || {}).appName || 'DMS') + '</div></div></div>';
      showChangePassword(true);
      return;
    }
    $('#auth').classList.add('hidden');
    $('#shell').classList.remove('hidden');
    setUnread(boot.unread);
    var openFirst = function (lk) {
      S.lookups = lk;
      buildShell();
      var first = store.get('route');
      var r = null;
      try { r = first ? JSON.parse(first) : null; } catch (e) { r = null; }
      go(r && ROUTES[r.name] && r.name !== 'docEdit' ? r.name : homeRoute(), r && r.name !== 'docEdit' ? r.params || {} : {}, true);
    };
    var cachedLk = cacheRead('lookups');
    if (cachedLk) {
      // ใช้รายการตัวเลือกรอบก่อนเปิดหน้าทันที แล้วอัปเดตเบื้องหลัง
      openFirst(cachedLk);
      if (!S.lkFresh) quiet(run('apiLookups', [S.token], true).then(function (lk) {
        S.lkFresh = true; cacheWrite('lookups', lk);
        if (JSON.stringify(lk) !== JSON.stringify(cachedLk)) { S.lookups = lk; buildShell(); }
      }));
    } else {
      quiet(call('apiLookups').then(function (lk) { S.lkFresh = true; cacheWrite('lookups', lk); openFirst(lk); }));
    }
  }

  function doLogout() {
    var tk = S.token;
    logoutLocal();
    if (tk) run('apiLogout', [tk]).catch(function () { /* ไม่เป็นไร */ });
  }
  function logoutLocal() {
    S.token = null; S.boot = null; S.lookups = null; S.catalog = null; S.parties = {};
    store.del('token'); store.del('route'); store.del('c.boot'); store.del('c.lookups'); S.lkFresh = false;
    destroyCharts();
    $('#modalRoot').innerHTML = '';
    showLogin();
  }

  function bottomItems() {

    var wanted = {
      VAN: ['dashboard', 'quickSale', 'docs', 'customers'],
      PRE: ['dashboard', 'quickSO', 'docs', 'customers'],

      ACC: ['dashboard', 'docs', 'approvals', 'reports'],
      ADMIN: ['dashboard', 'docs', 'approvals', 'reports']
    }[r] || ['dashboard', 'docs', 'reports', 'products'];

    store.set('route', JSON.stringify(S.route));

  // ---------- ไฟล์: อ่านเป็น base64 / ย่อรูป / ดาวน์โหลด / CSV / พิมพ์ ----------
  function readFileB64(file, maxImagePx) {
    return new Promise(function (resolve, reject) {
      if (maxImagePx && /^image\/(jpeg|png|webp)$/.test(file.type) && file.size > 300 * 1024) {
        var img = new Image();
        var url = URL.createObjectURL(file);
        img.onload = function () {
          var scale = Math.min(1, maxImagePx / Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          var data = c.toDataURL('image/jpeg', 0.82);
          resolve({ name: file.name.replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', b64: data.split(',')[1] });
        };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('image')); };
        img.src = url;
        return;
      }
      var fr = new FileReader();
      fr.onload = function () { resolve({ name: file.name, mime: file.type || 'application/octet-stream', b64: String(fr.result).split(',')[1] }); };
      fr.onerror = reject;
      fr.readAsDataURL(file);
    });

      el.innerHTML = html;

      var readF = function (page) {
        var nf = { docType: type, q: $('#fQ').value.trim(), pageSize: Number($('#dSize').value), page: page || 1, tab: adv ? 'adv' : 'list', sort: f.sort };
        var keys = ['docType', 'dateFrom', 'dateTo', 'status', 'salesRepId', 'warehouseId', 'paymentStatus', 'overdue', 'reviewStatus', 'pickStatus', 'printed'];

        return call('apiDocList', nf).then(function (res) {
          var sortTh = function (key, label, cls) {
            var on = nf.sort.indexOf(key) === 0, dir = on && /_asc$/.test(nf.sort) ? 'asc' : 'desc';

          var body = res.items.map(function (r) {
            return '<tr class="click" data-id="' + esc(r.DocId) + '"><td class="sel" data-label=""><input type="checkbox" class="dsel" data-id="' + esc(r.DocId) + '"' + (sel[r.DocId] ? ' checked' : '') + '></td>' +

              '<td data-label="' + esc(t('list.manage')) + '"><select class="input act-sel" data-act-id="' + esc(r.DocId) + '" data-type="' + esc(r.DocType) + '" data-st="' + esc(r.Status) + '">' +
              '<option value="">' + t('list.manage') + '</option><option value="view">' + t('list.view') + '</option>' +
              (['DRAFT', 'RETURNED'].indexOf(r.Status) >= 0 && dtInfo(r.DocType).canCreate ? '<option value="edit">' + t('edit') + '</option>' : '') +
              (String(r.DocNo).indexOf('TMP') !== 0 ? '<option value="print">' + t('doc.printA4') + '</option>' : '') +
              ((r.DocType === 'INV' || r.DocType === 'CL') && String(r.DocNo).indexOf('TMP') !== 0 ? '<option value="receipt">' + t('doc.printReceipt') + '</option>' : '') +
              '</select></td></tr>';
          }).join('');
          $('#docRes').innerHTML = '<div class="card">' + (res.items.length ? '<div class="table-wrap"><table class="tbl cards dms-tbl"><thead><tr>' + head + '</tr></thead><tbody>' + body +
            '</tbody></table></div>' : '<div class="empty">' + t('noData') + '</div>') +
            '<div class="list-foot"><span class="muted small">' + t('cust.showing', { a: start, b: Math.min(res.page * res.pageSize, res.total), n: res.total }) +
            ' <span id="dSelN"></span></span><span class="muted small">' + t('doc.sumNet', { v: money(res.totalAmount) }) + '</span></div>' +
            U.pager(res, reload).replace(/<span class="muted small">[^<]*<\/span>/, '<span></span>') + '</div>';
          var updN = function () { var n = Object.keys(sel).length; $('#dSelN').textContent = n ? '· ' + t('cust.selected', { n: n }) : ''; };

            };

          $$('.dsel').forEach(function (cb) {

          });
          if ($('#dAll')) $('#dAll').onchange = function () {

            updN();

          $$('th[data-sort]').forEach(function (th) {

              if (a === 'print') call('apiDocPrintHtml', id, 'A4').then(U.printHtml).catch(noop);
              if (a === 'receipt') call('apiDocPrintHtml', id, 'RECEIPT').then(U.printHtml).catch(noop);
            };
          });
          updN();
        });
      };
      var noop = function () {};
      var ids = function () { var x = Object.keys(sel); if (!x.length) toast(t('cust.selectFirst'), 'warn'); return x; };
      $$('[data-tab]', el).forEach(function (tbx) { tbx.onclick = function () { go('docs', Object.assign({}, readF(1), { tab: tbx.getAttribute('data-tab') }), true); }; });
      $('#fQ').onkeydown = function (e) { if (e.key === 'Enter') reload(1).catch(noop); };
      $('#fQ').oninput = U.debounce(function () { reload(1).catch(noop); }, 450);
      $('#dGo').onclick = function () { reload(1).catch(noop); };
      $('#dRef').onclick = function () { reload(readF().page).catch(noop); };
      $('#dSize').onchange = function () { reload(1).catch(noop); };
      if (adv) {
        $('#advGo').onclick = function () { reload(1).catch(noop); };
        $('#advClear').onclick = function () { go('docs', { docType: type, tab: 'adv' }, true); };
      }

      $$('[data-bulk]', el).forEach(function (b) {

            return;

          var msg = { approve: 'list.confirmApprove', delete: 'list.confirmDelete', inv: 'list.confirmInv' }[act];
          U.confirmBox(t(msg, { n: list.length }), { danger: act === 'delete' }).then(function (ok) {

            runBulk(list, function (id) { var x = fn(id); return { fn: x[0], args: x[1] }; }).then(function () { sel = {}; reload(readF().page); });
          });
        };
      });
      if ($('#pickSel')) $('#pickSel').onchange = function () {
        var v = this.value;
        this.value = '';
        var list = ids();
        if (!v || !list.length) return;
        call('apiSoPickList', list, v !== 'reset').then(function (r) {
          if (r.html) U.printHtml(r.html);

      return reload(f.page);
    }

        // เอกสารอ้างอิง
        if (r.refs.length || r.children.length) {
          html += '<div class="card"><div class="card-title"><h3>' + t('doc.related') + '</h3></div>' + r.refs.concat(r.children).map(function (x) {
            return '<a class="chip" data-doc="' + esc(x.DocId) + '">' + esc(x.DocType) + ' ' + esc(x.DocNo) + ' · ' + esc(t('st.' + x.Status)) + '</a>';
          }).join('') + '</div>';

        // ไฟล์แนบ
        html += '<div class="card"><div class="card-title"><h3>' + t('doc.attachments') + '</h3>' + (a.attach ? '<div class="btn-row">' +

          }).join('') + '</div>' : '<div class="muted small">' + t('noData') + '</div>') + '</div>';
        // ประวัติอนุมัติ + เวอร์ชัน
        html += '<div class="grid grid-2 stack"><div class="card"><div class="card-title"><h3>' + t('doc.history') + '</h3></div>' + (r.approvals.length ? '<ul class="timeline">' +
          r.approvals.map(function (h) {
            return '<li><b>' + esc(t('act.' + h.Action)) + '</b> · ' + esc(h.ByName) + ' <span class="muted small">' + esc(U.dateFmt(h.ActionAt)) + '</span>' +
              (h.Reason ? '<div class="muted small">' + esc(h.Reason) + '</div>' : '') + '</li>';
          }).join('') + '</ul>' : '<div class="muted small">' + t('noData') + '</div>') + '</div>' +
          '<div class="card"><div class="card-title"><h3>' + t('doc.versions') + '</h3></div><div class="list">' + r.versions.map(function (v) {
            return '<div class="list-item" data-ver="' + v.VersionNo + '"><span class="badge">v' + v.VersionNo + '</span><div class="main-col"><div class="title">' + esc(v.ChangeNote) +
              '</div><div class="meta">' + esc(v.ChangedBy) + ' · ' + esc(U.dateFmt(v.ChangedAt)) + '</div></div></div>';
          }).join('') + '</div></div></div>';

          html += '<div class="card"><div class="card-title"><h3>' + t('doc.log') + '</h3></div>' + U.table([
            { key: 'Timestamp', label: t('f.Time'), type: 'date' }, { key: 'User', label: t('f.User') },

          ], r.logs.slice().reverse()) + '</div>';

  };

  function totalsHtml(d) {
    var row = function (l, v, cls) { return '<div class="row ' + (cls || '') + '"><span>' + esc(l) + '</span><span>' + money(v) + '</span></div>'; };
    return '<div class="totals" style="margin-top:12px">' + row(t('f.SubTotal'), d.SubTotal) +
      (num(d.LineDiscountTotal) ? row(t('f.LineDiscountTotal'), -num(d.LineDiscountTotal)) : '') +
      (num(d.HeaderDiscountAmount) ? row(t('f.HeaderDiscount'), -num(d.HeaderDiscountAmount)) : '') +
      row(t('f.AfterDiscount') + (d.VatType === 'IN' ? ' (' + t('vat.IN') + ')' : ''), d.AfterDiscount) +
      (d.VatType !== 'NONE' ? row('VAT ' + rn(d.VatRate, 2) + '%', d.VatAmount) : '') + row(t('f.NetTotal'), d.NetTotal, 'grand') + '</div>';
  }

  function bindDocActions(el, r) {
    var d = r.doc;
    var after = function (msg) { return function () { toast(msg || t('saved'), 'ok'); U.refreshBadges(); U.refresh(); }; };
    var noop = function () {};
    var handlers = {
      submit: function () {
        var issue = !dtInfo(d.DocType).requiresApproval;
        U.confirmBox(issue ? t('doc.confirmIssue') : t('doc.confirmSubmit')).then(function (ok) {
          if (ok) call('apiDocSubmit', d.DocId).then(after()).catch(noop);
        });
      },
      approve: function () {
        U.confirmBox(t('doc.confirmApprove', { no: d.DocNo }), { reason: true, optional: true, reasonLabel: t('f.Note'), okText: t('doc.approve') }).then(function (note) {
          if (note !== null) call('apiDocApprove', d.DocId, note).then(after(t('doc.approved'))).catch(noop);
        });
      },
      reject: function () {
        U.confirmBox(t('doc.confirmReject'), { reason: true, danger: true, okText: t('doc.reject') }).then(function (why) {
          if (why) call('apiDocReject', d.DocId, why).then(after()).catch(noop);
        });
      },
      'return': function () {
        U.confirmBox(t('doc.confirmReturn'), { reason: true, okText: t('doc.return') }).then(function (why) {
          if (why) call('apiDocReturn', d.DocId, why).then(after()).catch(noop);
        });
      },
      cancel: function () {
        U.confirmBox(t('doc.confirmCancel', { no: d.DocNo }), { reason: true, danger: true, okText: t('doc.cancel') }).then(function (why) {
          if (why) call('apiDocCancel', d.DocId, why).then(after()).catch(noop);
        });
      },
      'delete': function () {
        U.confirmBox(t('doc.confirmDelete'), { danger: true, okText: t('delete') }).then(function (ok) {
          if (ok) call('apiDocDelete', d.DocId).then(function () { toast(t('doc.deleted'), 'ok'); go('docs', {}); }).catch(noop);
        });
      },
      edit: function () { go('docEdit', { id: d.DocId }); },
      paid: function () { call('apiDocMarkPaid', d.DocId, true).then(after()).catch(noop); },
      unpaid: function () { call('apiDocMarkPaid', d.DocId, false).then(after()).catch(noop); },
      reviewOk: function () { call('apiDocReview', d.DocId, true, '').then(after()).catch(noop); },
      reviewIssue: function () {
        U.confirmBox(t('doc.reviewIssue'), { reason: true }).then(function (why) {
          if (why) call('apiDocReview', d.DocId, false, why).then(after()).catch(noop);
        });
      },
      closeSo: function () {
        U.confirmBox(t('doc.confirmCloseSo'), { reason: true, okText: t('doc.closeSo') }).then(function (why) {
          if (why) call('apiDocCloseSo', d.DocId, why).then(after()).catch(noop);
        });
      },
      createInv: function () { invFromSoDialog(r); },
      collect: function () {
        if (U.role() === 'VAN') {
          vanCollectDialog({ DocId: d.DocId, DocNo: d.DocNo, PartyId: d.PartyId, PartyName: d.PartyName, NetTotal: num(d.NetTotal) - num(d.PaidAmount), PaymentType: d.PaymentType },
                           function () { U.refresh(); });
        } else go('clEdit', { party: d.PartyId, inv: d.DocId });
      },
      printA4: function () { call('apiDocPrintHtml', d.DocId, 'A4').then(U.printHtml).catch(noop); },
      printReceipt: function () { call('apiDocPrintHtml', d.DocId, 'RECEIPT').then(function (h) { U.printHtml(h); U.refresh(); }).catch(noop); },
      pdf: function () {
        toast(t('doc.makingPdf'));
        call('apiDocMakePdf', d.DocId).then(function (f) { U.downloadB64(f.name, f.mime, f.base64); U.refresh(); }).catch(noop);
      },
      upload: function () { uploadTo(d.DocId, false); },
      camera: function () { uploadTo(d.DocId, true); }
    };
    $$('[data-act]', el).forEach(function (b) {
      b.onclick = function () { var h = handlers[b.getAttribute('data-act')]; if (h) h(); };
    });
    $$('[data-doc]', el).forEach(function (x) { x.onclick = function () { go('doc', { id: x.getAttribute('data-doc') }); }; });
    $$('[data-att]', el).forEach(function (x) {
      x.onclick = function () {
        call('apiDocDownload', x.getAttribute('data-att')).then(function (f) { U.downloadB64(f.name, f.mime, f.base64); }).catch(noop);
      };
    });
    $$('[data-ver]', el).forEach(function (x) {
      x.onclick = function () {
        var vno = x.getAttribute('data-ver');
        call('apiDocVersion', d.DocId, vno).then(function (snap) {
          var sd = snap.doc;
          modal({
            title: d.DocNo + ' — v' + vno, wide: true,
            body: '<div class="kv">' + [['f.DocDate', U.dateFmt(sd.DocDate)], ['f.Party', sd.PartyName], ['f.Status', t('st.' + sd.Status)], ['f.Note', sd.Note]]
              .map(function (k) { return k[1] ? '<div><div class="k">' + t(k[0]) + '</div><div class="v">' + esc(k[1]) + '</div></div>' : ''; }).join('') + '</div><div class="gap"></div>' +
              U.table([{ key: 'ProductName', label: t('f.Product') }, { key: 'Qty', label: t('f.Qty'), fmt: function (i) { return U.qtyFmt(i.Qty) + ' ' + esc(i.Unit); } },
                       { key: 'DiscountAmount', label: t('f.Discount'), type: 'money' }, { key: 'LineTotal', label: t('f.LineTotal'), type: 'money' }], snap.items) +
              (NO_MONEY.indexOf(sd.DocType) < 0 ? totalsHtml(sd) : '')
          });
        }).catch(noop);
      };
    });
  }

  function uploadTo(docId, camera) {
    U.pickFile(camera ? 'image/*' : '.pdf,.jpg,.jpeg,.png,.xls,.xlsx,.doc,.docx', camera).then(function (file) {
      if (!file) return;
      var maxMb = num(S.boot.settings.MAX_FILE_MB) || 10;
      if (file.size > maxMb * 1024 * 1024 && !/^image\//.test(file.type)) { toast(t('ERR_FILE_SIZE', { max: maxMb }), 'err'); return; }
      U.readFileB64(file, 1600).then(function (f) {
        return call('apiDocUpload', docId, f.name, f.mime, f.b64, camera ? 'CAMERA' : 'UPLOAD');
      }).then(function () { toast(t('doc.uploaded'), 'ok'); U.refresh(); }).catch(function () {});
    });
  }

  /** สร้างใบกำกับภาษีจากใบสั่งขาย (เลือกจำนวนส่งจริงได้) */
  function invFromSoDialog(r) {
    var d = r.doc;
    var rows = r.items.map(function (i) {
      var remainBase = num(i.QtyBase) - num(i.QtyDelivered);
      return { line: i, remain: rn(remainBase / num(i.UnitFactor), 4) };
    }).filter(function (x) { return x.remain > 0; });
    var m = modal({
      title: t('doc.createInv'), wide: true,
      body: '<p class="muted">' + t('doc.createInvHint') + '</p>' + rows.map(function (x, idx) {
        return '<div class="line"><div class="line-head"><div class="name">' + esc(x.line.ProductName) + '<div class="code">' + esc(x.line.ProductCode) +
          ' · ' + t('doc.remain') + ' ' + U.qtyFmt(x.remain) + ' ' + esc(x.line.Unit) + '</div></div></div><div class="line-body">' +
          U.field(t('doc.deliverQty') + ' (' + x.line.Unit + ')', '<input class="input num" type="number" min="0" step="any" data-i="' + idx + '" value="' + x.remain + '">') + '</div></div>';
      }).join('') + '<div class="grid grid-2">' +
        U.field(t('f.PaymentType'), U.selectH('pay', ['CREDIT', 'CASH', 'TRANSFER'].map(function (v) { return { v: v, l: t('pay.' + v) }; }), d.PaymentType, 'id="invPay"')) + '</div>',
      foot: '<button class="btn" data-x2 type="button">' + t('cancel') + '</button><button class="btn btn-primary" data-ok type="button">' + t('doc.createInv') + '</button>'
    });
    $('[data-x2]', m.el).onclick = m.close;
    $('[data-ok]', m.el).onclick = function () {
      var deliver = [];
      var bad = false;
      $$('[data-i]', m.el).forEach(function (inp) {
        var x = rows[Number(inp.getAttribute('data-i'))];
        var q = num(inp.value);
        if (q > x.remain + 1e-9 || q < 0) bad = true;
        if (q > 0) deliver.push({ RefLineId: x.line.LineId, Qty: q, Unit: x.line.Unit });
      });
      if (bad) { toast(t('ERR_DELIVER_OVER', {}), 'err'); return; }
      if (!deliver.length) { toast(t('ERR_NO_LINES'), 'err'); return; }
      this.disabled = true;
      var self = this;
      call('apiDocCreateInvFromSo', d.DocId, deliver, { PaymentType: $('#invPay', m.el).value }).then(function (res) {
        m.close();
        showWarnings(res.warnings);
        toast(t('doc.invCreated', { no: res.DocNo }), 'ok');
        go('doc', { id: res.DocId });
      }).catch(function () { self.disabled = false; });
    };
  }

  function showWarnings(ws) {
    (ws || []).forEach(function (w) { toast(t(w.code, w.params), 'warn', 7000); });
  }

  // ===============================================================
  //  สร้าง / แก้ไขเอกสาร
  // ===============================================================
  R.quickSale = { title: 'menu.quickSale', render: function (el) {
    return vanPendingGate(el).then(function (blocked) { if (!blocked) return renderEditor(el, { type: 'INV' }); });
  } };
  R.quickSO = { title: 'menu.quickSO', render: function (el) { return renderEditor(el, { type: 'SO' }); } };
  R.docEdit = {
    title: function (p) { return p.id ? t('doc.editTitle') : t('doc.newTitle', { type: U.docTypeName(p.type) }); }, back: true, nav: 'docs',
    render: function (el, p) {
      if (p.type === 'CL') return drawCollection(el, null, p);
      return renderEditor(el, p);
    }
  };

  /**
   * ตัวแก้ไขเอกสาร
   * สถานะเก็บใน ed = { type, docId, h:{หัวเอกสาร}, lines:[...], calc:{ผลคำนวณ} }
   */
  function renderEditor(el, p) {
    var ed = { type: p.type, docId: p.id || '', h: {}, lines: [], party: null, refs: [] };
    var loadExisting = p.id ? call('apiDocGet', p.id) : Promise.resolve(null);
    return loadExisting.then(function (r) {
      if (r) {
        var d = r.doc;
        if (d.DocType === 'CL') { ed.cl = r; return null; }
        ed.type = d.DocType;
        ed.status = d.Status;
        ed.docNo = d.DocNo;
        ed.docTime = d.DocTime;
        ed.h = { DocDate: d.DocDate, PartyId: d.PartyId, SalesRepId: d.SalesRepId, Channel: d.Channel, WarehouseId: d.WarehouseId,
                 ToWarehouseId: d.ToWarehouseId, RefDocIds: d.RefDocIds, VatType: d.VatType, PaymentType: d.PaymentType,
                 HeaderDiscountType: d.HeaderDiscountType || 'PCT', HeaderDiscountValue: num(d.HeaderDiscountValue), Tags: d.Tags, Note: d.Note, Reason: d.Reason,
                 RefNo: d.RefNo || '', RefDate: d.RefDate || '', DeliveryType: d.DeliveryType || '', DeliveryDate: d.DeliveryDate || '', Sellable: d.Sellable !== 'FALSE' };
        ed.party = d.PartyId ? { id: d.PartyId, name: d.PartyName, taxId: d.PartyTaxId, branch: d.PartyBranch } : null;
        ed.refs = r.refs.map(function (x) { return { id: x.DocId, no: x.DocNo, type: x.DocType }; });
        ed.lines = r.items.map(function (i) {
          return { _k: U.uid(), ProductCode: i.ProductCode, Unit: i.Unit, Qty: num(i.Qty), IsFree: i.IsFree === 'TRUE',
                   DiscountType: i.DiscountType || 'PCT', DiscountValue: num(i.DiscountValue), DiscountEditedBy: i.DiscountEditedBy || '',
                   UnitPrice: SALE_TIER.indexOf(d.DocType) >= 0 ? '' : num(i.UnitPrice), ItemCondition: i.ItemCondition || 'GOOD',
                   RefLineId: i.RefLineId || '', Note: i.Note || '', Delivered: rn(num(i.QtyDelivered) / (num(i.UnitFactor) || 1), 4) };
        });
      } else {
        var isVan = U.role() === 'VAN';
        ed.h = { DocDate: U.today(), VatType: S.boot.settings.DEFAULT_VAT_TYPE || 'EX', PaymentType: isVan ? 'CASH' : (ed.type === 'INV' || ed.type === 'SO' || ed.type === 'PO' ? 'CREDIT' : ''),
                 HeaderDiscountType: 'PCT', HeaderDiscountValue: 0, WarehouseId: '', ToWarehouseId: '', Channel: '', Sellable: true };
        if (ed.type === 'GR' || ed.type === 'PO') ed.h.HeaderDiscountValue = num(S.boot.settings.GR_DEFAULT_DISCOUNT_PCT);
        if (!isVan) {
          if (ed.type === 'VU') ed.h.ToWarehouseId = 'WH-MAIN';
          if (['ADJ', 'SC', 'TF', 'RT', 'INV', 'SO', 'PO', 'GR'].indexOf(ed.type) >= 0) ed.h.WarehouseId = 'WH-MAIN';
        } else if (ed.type === 'VU') ed.h.ToWarehouseId = 'WH-MAIN';
      }
      if (ed.cl) return null;
      var info = dtInfo(ed.type);
      if (!r && !info.canCreate) throw { code: 'ERR_NO_PERMISSION', params: {} };
      return Promise.all([U.loadCatalog(ed.h.DocDate), info.partyType === 'C' || info.partyType === 'S' ? U.loadParties(info.partyType) : Promise.resolve([]),
                          loadStock(srcWh(ed), true)]);
    }).then(function (res) {
      if (ed.cl) return drawCollection(el, ed.cl, {});
      var full = ed.party ? (res[1] || []).filter(function (x) { return x.id === ed.party.id; })[0] : null;
      if (full) ed.party = full;
      drawEditor(el, ed);
    });
  }

  function isVanSale(ed) {
    if (U.role() === 'VAN') return true;
    var w = (S.lookups.warehouses || []).filter(function (x) { return x.id === ed.h.WarehouseId; })[0];
    return !!(w && w.type === 'VAN');
  }
  function channelOf(ed) {
    if (ed.party && ed.party.tierChannel && SALE_TIER.indexOf(ed.type) >= 0) return ed.party.tierChannel;   // ตามกลุ่มราคาลูกค้า
    if (isVanSale(ed)) return 'VAN';
    var r = U.role();
    if (r === 'PRE') return 'PRE';
    if (r === 'SALES') return S.catalog.channel || 'PRE';
    return ed.h.Channel === 'VAN' ? 'VAN' : 'PRE';
  }

  // ---------- สต็อกคงเหลือ (ช่อง "สินค้าคงเหลือปัจจุบัน") ----------
  function srcWh(ed) {
    var vanWh = S.boot.user.VanWarehouseId;
    if (U.role() === 'VAN') {
      if (ed.type === 'VL') return 'WH-MAIN';
      return vanWh || '';
    }
    if (ed.type === 'VL') return 'WH-MAIN';
    return ed.h.WarehouseId || 'WH-MAIN';
  }
  function loadStock(wh, force) {
    S.stockCache = S.stockCache || {};
    if (!wh) return Promise.resolve(null);
    var c = S.stockCache[wh];
    if (c && !force && Date.now() - c.at < 60000) return Promise.resolve(c);
    return call('apiStockOnHand', wh).then(function (r) {
      S.stockCache[wh] = { at: Date.now(), qty: r.qty || {}, visible: !!r.visible };
      return S.stockCache[wh];
    }).catch(function () { return null; });
  }
  /** ยอดคงเหลือ (หน่วยฐาน) ของคลังต้นทาง — null = ไม่มีสิทธิ์ดู */
  function availOf(ed, code) {
    var c = S.stockCache && S.stockCache[srcWh(ed)];
    if (!c || !c.visible) return null;
    var v = c.qty[code] || [0, 0];
    return ['SO', 'INV', 'TF', 'VL', 'VU'].indexOf(ed.type) >= 0 ? num(v[0]) - num(v[1]) : num(v[0]);
  }

  /**
   * หน้าสร้าง/แก้ไขเอกสาร (รูปแบบเดียวกับ DMS เดิม)
   *  แถบปุ่มด้านบน → หัวเอกสาร 2 ฝั่ง → โปรโมชั่น → แถวเพิ่มสินค้า + ตารางสินค้า → สรุปยอด
   */
  function drawEditor(el, ed) {
    var info = dtInfo(ed.type);
    var type = ed.type;
    var role = U.role();
    var isSale = SALE_TIER.indexOf(type) >= 0;
    var isXfer = ['TF', 'VL', 'VU'].indexOf(type) >= 0;
    var money2 = NO_MONEY.indexOf(type) < 0 || isXfer;          // เอกสารคลังแสดงมูลค่าอ้างอิง
    var noVat = NO_MONEY.indexOf(type) >= 0;
    var editPrice = money2 && !isSale && !isXfer;                // PO GR CN RT แก้ราคาได้
    var lineDisc = ['PO', 'GR'].indexOf(type) >= 0;              // ส่วนลดรายการแบบกรอกเอง
    var isVan = role === 'VAN';
    var canHeadDisc = !!U.can('doc.editDiscount');
    var canDisc = canHeadDisc || !!(ed.party && ed.party.allowManualDiscount);
    var cust = info.partyType === 'C' ? ed.party : null;
    if (cust && isSale) {
      if (!cust.isTaxable) ed.h.VatType = 'NONE';
      if (cust.paymentType === 'CASH' && ed.h.PaymentType === 'CREDIT') ed.h.PaymentType = 'CASH';
      if (!canHeadDisc) { ed.h.HeaderDiscountType = 'PCT'; ed.h.HeaderDiscountValue = num(cust.discountRate); }
    }
    if (noVat) ed.h.VatType = 'NONE';
    var whs = S.lookups.warehouses || [];
    var whOpts = function (types) { return whs.filter(function (w) { return types.indexOf(w.type) >= 0; }).map(function (w) { return { v: w.id, l: w.name }; }); };
    var reps = S.lookups.salesReps || [];
    var repOpts = [{ v: '', l: t('pleaseSelect') }].concat(reps.map(function (r) { return { v: r.id, l: r.id + ' ' + r.name }; }));
    var vanSale = isVan && type === 'INV' && !ed.docId;

        return '<div class="opt ' + (i === hl ? 'hl' : '') + '" data-c="' + esc(p.ProductCode) + '"><b>' + esc(p.ProductCode) + '</b> ' + esc(p.NameTh) +
          '<div class="muted small">' + (money2 ? money(isSale || isXfer ? p.PricePerCase : (p.CostPerCase !== undefined ? p.CostPerCase : p.PricePerCase)) + '/' + esc(p.CaseUnit) : '') +
          (av !== null ? ' · ' + t('ed.onHand') + ' ' + U.qtyFmt(rn(av / p.CaseQty, 2)) + ' ' + esc(p.CaseUnit) : '') + '</div></div>';
      }).join('') : '<div class="opt muted">' + t('noData') + '</div>';
      sug.classList.remove('hidden');
      $$('[data-c]', sug).forEach(function (o) {
        o.onmousedown = function (e) { e.preventDefault(); selectProduct(o.getAttribute('data-c')); };
      });
    };
    sInp.oninput = function () { pend = null; drawEntry(); drawSug(false); };
    sInp.onfocus = function () { if (pend) sInp.select(); };
    sInp.onblur = function () { setTimeout(function () { sug.classList.add('hidden'); }, 150); };
    sInp.onkeydown = function (e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!matches.length) return;
        hl = (hl + (e.key === 'ArrowDown' ? 1 : -1) + matches.length) % matches.length;
        $$('.opt', sug).forEach(function (o, i) { o.classList.toggle('hl', i === hl); });
      } else if (e.key === 'Enter') {
        e.preventDefault();
        var code = sInp.value.trim();
        var bc = S.catalog.barcode[code];
        if (bc) addProduct(bc.code, bc.unit, 1);                    // รหัส/บาร์โค้ดตรง → เพิ่มทันที
        else if (S.catalog.map[code]) addProduct(code, null, 1);
        else if (hl >= 0 && matches[hl]) selectProduct(matches[hl].ProductCode);
      }
    };
    $('#btnProdList').onclick = function () { sInp.focus(); drawSug(true); };
    $('#btnScan').onclick = function () {
      U.scanBarcode().then(function (code) {
        if (!code) return;
        var bc = S.catalog.barcode[code];
        if (bc) addProduct(bc.code, bc.unit, 1);
        else if (S.catalog.map[code]) addProduct(code, null, 1);
        else toast(t('scan.unknown', { code: code }), 'err');
      });
    };
    $('#enQty').oninput = drawEntry;
    $('#enQty').onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); $('#btnAdd').click(); } };
    $('#enUnit').onchange = function () { priceTouched = false; drawEntry(); };
    if ($('#enPrice')) $('#enPrice').oninput = function () { priceTouched = true; drawEntry(); };
    if ($('#enDisc')) $('#enDisc').oninput = drawEntry;
    $('#btnAdd').onclick = function () {
      if (!pend) {
        var code = sInp.value.trim();
        if (S.catalog.map[code]) selectProduct(code);
        else { toast(t('ed.pickProduct'), 'warn'); sInp.focus(); return; }
      }
      addProduct(pend, $('#enUnit').value, num($('#enQty').value), $('#enPrice') ? $('#enPrice').value : undefined, $('#enDisc') ? num($('#enDisc').value) : 0);
    };
    $('#btnMulti').onclick = function () { multiAddDialog(ed, function (rows) { rows.forEach(function (r) { addProduct(r.code, r.unit, r.qty); }); }); };

    // ---------- ตารางสินค้า ----------
    var showSoRemain = type === 'SO' && ed.lines.some(function (l) { return num(l.Delivered) > 0; });
    var drawLines = function () {
      var box = $('#lines');
      $('#lineCount').textContent = ed.lines.length ? '(' + ed.lines.length + ')' : '';
      var cols = ['#', t('ed.code'), t('ed.name'), t('ed.onHand'), t('f.Qty')];
      if (showSoRemain) cols.push(t('ed.soRemain'));
      cols.push('UOM');
      if (money2) cols.push(t('f.UnitPrice'), t('ed.gross'));
      if (money2 && !isXfer && type !== 'CN' && type !== 'RT') cols.push(t('f.Discount'));
      if (isSale) cols.push(t('ed.promoDisc'), t('ed.freeGoods'), t('ed.premium'));
      if (type === 'RT') cols.push(t('f.ItemCondition'));
      if (money2) cols.push(t('ed.net'));
      cols.push('');
      if (!ed.lines.length) {
        box.innerHTML = '<div class="table-wrap"><table class="tbl ed-lines"><thead><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') +
          '</tr></thead></table></div><div class="empty">' + t('doc.noLines') + '</div>';
        recalc();
        return;
      }
      var rows = ed.lines.map(function (l, idx) {
        var p = S.catalog.map[l.ProductCode] || { NameTh: l.ProductCode, units: [{ Unit: l.Unit, Factor: 1 }], CaseQty: 1 };
        var units = p.units.map(function (u) { return { v: u.Unit, l: u.Unit + (u.Factor > 1 ? ' (' + u.Factor + ')' : '') }; });
        var fromSo = String(l.DiscountEditedBy).indexOf('SO:') === 0;
        var cell = function (label, inner, cls) { return '<td class="' + (cls || '') + '" data-label="' + esc(label) + '">' + inner + '</td>'; };
        var tr = cell('#', String(idx + 1), 'c') + cell(t('ed.code'), esc(l.ProductCode), 'nowrap') + cell(t('ed.name'), esc(p.NameTh) + (fromSo ? '<div class="muted small">' + t('doc.fromSo') + '</div>' : ''), 'ed-name') +
          cell(t('ed.onHand'), '<span data-stk></span>', 'num') +
          cell(t('f.Qty'), '<div class="qty sm"><button type="button" data-step="-1">−</button><input type="number" step="any" data-f="Qty" value="' + esc(l.Qty) + '"' +
            (type === 'ADJ' ? '' : ' min="0"') + '><button type="button" data-step="1">+</button></div>');
        if (showSoRemain) tr += cell(t('ed.soRemain'), U.qtyFmt(Math.max(rn(num(l.Qty) - num(l.Delivered), 4), 0)), 'num');
        tr += cell('UOM', U.selectH('u', units, l.Unit, 'data-f="Unit" class="input sm"' + (fromSo ? ' disabled' : '')));
        if (money2) {
          tr += cell(t('f.UnitPrice'), editPrice ? '<input class="input num sm" type="number" min="0" step="any" data-f="UnitPrice" placeholder="' + t('auto') + '" value="' + esc(l.UnitPrice) + '">' : '<span data-price></span>', 'num') +
            cell(t('ed.gross'), '<span data-gross></span>', 'num');
        }
        if (money2 && !isXfer && type !== 'CN' && type !== 'RT') {
          var d = '-';
          if (lineDisc) {
            d = '<div class="input-group">' + U.selectH('dt', [{ v: 'PCT', l: '%' }, { v: 'BAHT', l: '฿' }], l.DiscountType, 'data-f="DiscountType" class="input sm" style="width:60px"') +
              '<input class="input num sm" type="number" min="0" step="any" data-f="DiscountValue" value="' + esc(l.DiscountValue) + '" style="width:80px"></div>';
          } else if (isSale && l.DiscountEditedBy && !fromSo) {
            d = '<div class="input-group">' + U.selectH('dt', [{ v: 'PCT', l: '%' }, { v: 'BAHT', l: '฿' }], l.DiscountType, 'data-f="DiscountType" class="input sm" style="width:60px"') +
              '<input class="input num sm" type="number" min="0" step="any" data-f="DiscountValue" value="' + esc(l.DiscountValue) + '" style="width:80px">' +
              '<button class="btn btn-sm" type="button" data-auto title="' + esc(t('ed.autoDisc')) + '">↺</button></div>';
          } else if (isSale && canDisc && !l.IsFree && !p.IsPremium && !fromSo) {
            d = '<span data-mdisc></span> <button class="icon-btn sm" type="button" data-manual title="' + esc(t('doc.editDisc')) + '">' + icon('edit') + '</button>';
          } else d = '<span data-mdisc></span>';
          tr += cell(t('f.Discount'), d, 'num');
        }
        if (isSale) {
          tr += cell(t('ed.promoDisc'), '<span data-pdisc></span>', 'num') +
            cell(t('ed.freeGoods'), p.IsPremium || fromSo ? (l.IsFree ? '✓' : '') : '<input type="checkbox" data-f="IsFree"' + (l.IsFree ? ' checked' : '') + '>', 'c') +
            cell(t('ed.premium'), p.IsPremium ? '✓' : '', 'c');
        }
        if (type === 'RT') tr += cell(t('f.ItemCondition'), U.selectH('c', [{ v: 'GOOD', l: t('cond.GOOD') }, { v: 'DAMAGED', l: t('cond.DAMAGED') }], l.ItemCondition, 'data-f="ItemCondition" class="input sm"'));
        if (money2) tr += cell(t('ed.net'), '<b data-amt></b>', 'num');
        tr += cell('', '<button class="icon-btn" type="button" data-del title="remove">' + icon('x') + '</button>', 'c');
        return '<tr class="line-row" data-k="' + l._k + '">' + tr + '</tr>';
      }).join('');
      box.innerHTML = '<div class="table-wrap"><table class="tbl cards ed-lines"><thead><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>';
      $$('#lines tr.line-row').forEach(function (row) {
        var k = row.getAttribute('data-k');
        var l = ed.lines.filter(function (x) { return x._k === k; })[0];
        $('[data-del]', row).onclick = function () { ed.lines = ed.lines.filter(function (x) { return x._k !== k; }); drawLines(); };
        $$('[data-step]', row).forEach(function (b) {
          b.onclick = function () {
            var nv = rn(num(l.Qty) + Number(b.getAttribute('data-step')), 4);
            if (nv < 0 && type !== 'ADJ') nv = 0;
            l.Qty = nv;
            $('[data-f=Qty]', row).value = nv;
            recalc();
          };
        });
        $$('[data-f]', row).forEach(function (inp) {
          var f = inp.getAttribute('data-f');
          var ev = inp.type === 'checkbox' || inp.tagName === 'SELECT' ? 'change' : 'input';
          inp.addEventListener(ev, function () {
            if (inp.type === 'checkbox') l[f] = inp.checked;
            else if (f === 'Qty' || f === 'DiscountValue') l[f] = inp.value === '' ? 0 : num(inp.value);
            else if (f === 'UnitPrice') l[f] = inp.value === '' ? '' : num(inp.value);
            else l[f] = inp.value;
            if (f === 'IsFree' || f === 'Unit') drawLines(); else recalc();
          });
        });
        if ($('[data-manual]', row)) $('[data-manual]', row).onclick = function () {
          var c = ed.calc && ed.calc.byKey[k];
          l.DiscountEditedBy = S.boot.user.UserId;
          l.DiscountType = 'PCT';
          l.DiscountValue = c ? c.AutoDiscountPct : 0;
          drawLines();
        };
        if ($('[data-auto]', row)) $('[data-auto]', row).onclick = function () { l.DiscountEditedBy = ''; drawLines(); };
      });
      recalc();
    };

    // ---------- คำนวณ (สูตรเดียวกับ server) ----------
    var recalc = function () {
      var c = calcDoc(ed);
      ed.calc = c;
      var manualSum = 0, promoSum = 0;
      $$('#lines tr.line-row').forEach(function (row) {
        var x = c.byKey[row.getAttribute('data-k')];
        if (!x) return;
        var auto = isSale && !x.DiscountEditedBy;
        if (auto) promoSum += x.DiscountAmount; else manualSum += x.DiscountAmount;
        var av = availOf(ed, x.ProductCode);
        var stk = $('[data-stk]', row);
        if (stk) {
          if (av === null) stk.textContent = '-';
          else {
            stk.textContent = U.qtyFmt(rn(av / x.UnitFactor, 4));
            stk.className = x.QtyBase > av + 1e-9 && ['SO', 'INV', 'TF', 'VL', 'VU'].indexOf(type) >= 0 ? 'stock-low' : '';
          }
        }
        if ($('[data-price]', row)) $('[data-price]', row).textContent = money(x.UnitPrice);
        if ($('[data-gross]', row)) $('[data-gross]', row).textContent = money(x.GrossAmount);
        if ($('[data-mdisc]', row)) $('[data-mdisc]', row).textContent = !auto && x.DiscountAmount ? money(x.DiscountAmount) : '0.00';
        if ($('[data-pdisc]', row)) $('[data-pdisc]', row).innerHTML = auto && x.DiscountAmount ? money(x.DiscountAmount) +
          '<div class="muted small">' + (x.DiscountType === 'PCT' ? rn(x.DiscountValue, 2) + '%' : '') + (x.PromoGroupId ? ' ' + esc(x.PromoGroupId) : '') + '</div>' : '0.00';
        if ($('[data-amt]', row)) $('[data-amt]', row).textContent = money(x.LineTotal);
      });
      // กล่อง Tier
      var tb = $('#tierBox');
      if (tb) {
        if (c.groups.length) {
          tb.innerHTML = '<div class="tier-box" style="margin:10px 0 0"><div class="strong">' + t('tier.title') + ' · ' + esc(t('ch.' + c.channel)) + (c.promoName ? ' · ' + esc(c.promoName) : '') + '</div>' +
            c.groups.map(function (g) {
              var hint = '';
              if (g.next) {
                var poolHints = g.pools.filter(function (pl) { return pl.toNext > 0; }).map(function (pl) { return t('tier.orPieces', { n: U.qtyFmt(pl.toNext), size: pl.size }); });
                hint = '<div class="tier-hint">' + t('tier.next', { n: g.next.MinCases - g.cases, pct: g.next.DiscountValue }) + (poolHints.length ? ' (' + poolHints.join(', ') + ')' : '') + '</div>';
              }
              return '<div class="grp"><span>' + esc(g.name) + '</span><span><b>' + t('tier.cases', { n: g.cases }) + '</b> → ' +
                (g.tier ? (g.tier.DiscountType === 'PCT' ? g.tier.DiscountValue + '%' : money(g.tier.DiscountValue) + '/' + t('case')) : '-') + '</span></div>' + hint;
            }).join('') + '</div>';
        } else if (!c.promoName) {
          tb.innerHTML = '<div class="alert info" style="margin:10px 0 0">' + t('tier.none') + '</div>';
        } else tb.innerHTML = '<div class="muted small" style="margin-top:8px">' + t('ed.promoHere') + '</div>';
      }
      if (money2) {
        var d = c.totals;
        var row = function (l, v, cls) { return '<div class="row ' + (cls || '') + '"><span>' + esc(l) + ':</span><span>' + money(v) + '</span></div>'; };
        var hdPct = ed.h.HeaderDiscountType === 'PCT';
        var exempt = d.VatType === 'NONE' ? d.AfterDiscount : 0;
        var taxable = d.VatType === 'NONE' ? 0 : (d.VatType === 'IN' ? r2(d.AfterDiscount - d.VatAmount) : d.AfterDiscount);
        $('#totalsBox').innerHTML = '<div class="totals">' + row(t('ed.sumGoods'), d.SubTotal) +
          (isSale ? row(t('ed.custDisc') + ' (' + (hdPct ? rn(ed.h.HeaderDiscountValue, 2).toFixed(2) : '0.00') + ' %)', hdPct ? d.HeaderDiscountAmount : 0) : '') +
          row(t('f.Discount'), r2(manualSum + (!isSale || !hdPct ? d.HeaderDiscountAmount : 0))) +
          (isSale ? row(t('ed.promoDisc'), r2(promoSum)) : '') +
          row(t('ed.afterDisc'), d.AfterDiscount) + row(t('ed.exempt'), exempt) + row(t('ed.taxable'), taxable) +
          row('VAT (' + rn(d.VatRate, 2).toFixed(2) + ' %)', d.VatAmount) + row(t('ed.rounding'), 0) + row(t('ed.grand'), d.NetTotal, 'grand') + '</div>';
      }
    };

    // ---------- บันทึก ----------
    $('#btnCancelEd').onclick = function () { U.goBack(); };
    var save = function (opts) {
      readHead();
      var payload = Object.assign({}, ed.h);
      payload.DocType = type;
      payload.DocId = ed.docId;
      payload.RefDocIds = ed.refs.map(function (x) { return x.id; }).join(',');
      if (isVan || role === 'PRE' || role === 'SALES') delete payload.SalesRepId;
      if ((info.partyType === 'C' || info.partyType === 'S') && !payload.PartyId) { toast(t('ERR_REQUIRED', { field: t('f.Party') }), 'err'); return; }
      if (!ed.lines.length) { toast(t('ERR_NO_LINES'), 'err'); return; }
      payload.lines = ed.lines.map(function (l) {
        return { ProductCode: l.ProductCode, Unit: l.Unit, Qty: num(l.Qty), UnitPrice: l.UnitPrice === '' ? '' : num(l.UnitPrice), IsFree: !!l.IsFree,
                 DiscountType: l.DiscountType, DiscountValue: num(l.DiscountValue), DiscountEditedBy: l.DiscountEditedBy || '',
                 ItemCondition: l.ItemCondition, RefLineId: l.RefLineId, Note: l.Note };
      });
      var bad = payload.lines.filter(function (l) { return type === 'ADJ' ? l.Qty === 0 : l.Qty <= 0; });
      if (bad.length) { toast(t('ERR_QTY', { line: '' }), 'err'); return; }
      $$('.ed-btns .btn', el).forEach(function (b) { b.disabled = true; });
      call('apiDocSave', payload, opts).then(function (res) {
        showWarnings(res.warnings);
        toast(t('doc.savedNo', { no: docNoText(res.DocNo), st: t('st.' + res.Status) }), 'ok', 3500);
        S.catalog = null;
        S.stockCache = {};
        U.refreshBadges();
        if (S.history.length && S.history[S.history.length - 1].name === 'doc') S.history.pop();
        if (vanSale && res.Status === 'APPROVED') {
          go('doc', { id: res.DocId }, true);
          S.history.push({ name: 'quickSale', params: {} });
          vanCollectAfterSale(res);
          return;
        }
        go('doc', { id: res.inv ? res.inv.DocId : res.DocId }, true);
        S.history.push({ name: 'docs', params: { docType: type } });
        if (res.inv) toast(t('doc.invCreated', { no: res.inv.DocNo }), 'ok', 5000);
      }).catch(function () { $$('.ed-btns .btn', el).forEach(function (b) { b.disabled = false; }); });
    };
    if ($('#btnSaveDraft')) $('#btnSaveDraft').onclick = function () { save({}); };
    $('#btnSaveSubmit').onclick = function () {
      if (pending) { save({}); return; }
      if (vanSale) {
        readHead();
        var tot = ed.calc ? ed.calc.totals.NetTotal : 0;
        U.confirmBox(t('van.confirmSaleMsg', { name: ed.party ? ed.party.name : '', total: money(tot), pay: t('pay.' + (ed.h.PaymentType || 'CASH')) }),
          { okText: t('van.confirmSale') }).then(function (ok) { if (ok) save({ submit: true }); });
        return;
      }
      U.confirmBox(issue ? t('doc.confirmIssue') : t('doc.confirmSubmit')).then(function (ok) { if (ok) save({ submit: true }); });
    };
    if ($('#btnSaveApprove')) $('#btnSaveApprove').onclick = function () {
      U.confirmBox(t('ed.confirmApprove')).then(function (ok) { if (ok) save({ submit: true, approve: true }); });
    };
    if ($('#btnSaveInv')) $('#btnSaveInv').onclick = function () {
      U.confirmBox(t('ed.confirmInv')).then(function (ok) { if (ok) save({ submit: true, approve: true, createInv: true }); });
    };
    drawLines();
  }

  /** เพิ่มสินค้าหลายรายการพร้อมกัน */
  function multiAddDialog(ed, done) {
    var list = S.catalog.products.filter(function (p) { return productAllowed(p, ed); });
    var qty = {}, unit = {};
    var m = modal({
      title: t('ed.multiAdd'), wide: true,
      body: '<input class="input" id="maQ" placeholder="' + esc(t('search')) + '"><div class="gap"></div><div id="maList" class="table-wrap" style="max-height:55vh;overflow:auto"></div>',
      foot: '<span class="muted small" id="maN" style="margin-right:auto"></span><button class="btn" data-x2 type="button">' + t('cancel') + '</button>' +
        '<button class="btn btn-primary" data-ok type="button">' + t('ed.addSelected') + '</button>'
    });
    var draw = function () {
      var q = $('#maQ', m.el).value.trim().toLowerCase();
      var rows = list.filter(function (p) { return !q || (p.ProductCode + ' ' + p.NameTh + ' ' + p.Barcode).toLowerCase().indexOf(q) >= 0; }).slice(0, 300);
      $('#maList', m.el).innerHTML = '<table class="tbl"><thead><tr><th>' + t('ed.code') + '</th><th>' + t('ed.name') + '</th><th class="num">' + t('ed.onHand') + '</th><th>UOM</th><th>' +
        t('f.Qty') + '</th></tr></thead><tbody>' + rows.map(function (p) {
          var av = availOf(ed, p.ProductCode);
          var du = unit[p.ProductCode] || defaultUnit(p, ed);
          return '<tr><td class="nowrap">' + esc(p.ProductCode) + '</td><td>' + esc(p.NameTh) + '</td><td class="num">' + (av === null ? '-' : U.qtyFmt(rn(av / p.CaseQty, 2)) + ' ' + esc(p.CaseUnit)) +
            '</td><td>' + U.selectH('mu', p.units.map(function (u) { return { v: u.Unit, l: u.Unit }; }), du, 'class="input sm" data-mu="' + esc(p.ProductCode) + '"') + '</td>' +
            '<td><input class="input num sm" type="number" min="0" step="any" style="width:90px" data-mq="' + esc(p.ProductCode) + '" value="' + esc(qty[p.ProductCode] || '') + '"></td></tr>';
        }).join('') + '</tbody></table>';
      $$('[data-mq]', m.el).forEach(function (i) { i.oninput = function () { qty[i.getAttribute('data-mq')] = num(i.value); cnt(); }; });
      $$('[data-mu]', m.el).forEach(function (s) { s.onchange = function () { unit[s.getAttribute('data-mu')] = s.value; }; });
    };
    var cnt = function () { $('#maN', m.el).textContent = t('cust.selected', { n: Object.keys(qty).filter(function (k) { return qty[k] > 0; }).length }); };
    $('#maQ', m.el).oninput = U.debounce(draw, 250);
    $('[data-x2]', m.el).onclick = m.close;
    $('[data-ok]', m.el).onclick = function () {
      var rows = Object.keys(qty).filter(function (k) { return qty[k] > 0; }).map(function (k) {
        var p = S.catalog.map[k];
        return { code: k, unit: unit[k] || defaultUnit(p, ed), qty: qty[k] };
      });
      if (!rows.length) { toast(t('ERR_NO_LINES'), 'warn'); return; }
      m.close();
      done(rows);
    };
    draw();
    cnt();
  }

  function productAllowed(p, ed) {
    if (p.Status !== 'ACTIVE') return false;
    if (isVanSale(ed) && SALE_TIER.indexOf(ed.type) >= 0 && p.SaleChannels === 'PRE') return false;
    return true;
  }
  function defaultUnit(p, ed) {
    if (U.role() === 'VAN' && SALE_TIER.indexOf(ed.type) >= 0) return p.BaseUnit;
    var d = p.units.filter(function (u) { return u.IsDefaultSale; })[0];
    return d ? d.Unit : p.BaseUnit;
  }
  /** คำนวณราคา ส่วนลด Tier และยอดรวม (สูตรเดียวกับ server) */
  function calcDoc(ed) {
    var type = ed.type;
    var isSale = SALE_TIER.indexOf(type) >= 0;
    var noMoney = NO_MONEY.indexOf(type) >= 0;
    var cat = S.catalog;
    var promo = cat.promo;
    var channel = channelOf(ed);
    var out = [];
    var byKey = {};
    ed.lines.forEach(function (l) {
      var p = cat.map[l.ProductCode];
      if (!p) return;
      var unit = p.units.filter(function (u) { return u.Unit === l.Unit; })[0] || p.units[0];
      var factor = num(unit.Factor), caseQty = num(p.CaseQty) || 1, qty = num(l.Qty);
      var qtyBase = rn(qty * factor, 6);
      var x = { _k: l._k, ProductCode: p.ProductCode, Unit: unit.Unit, UnitFactor: factor, Qty: qty, QtyBase: qtyBase, CaseQty: caseQty,
                IsFree: false, PromoGroupId: '', AutoDiscountPct: 0, DiscountType: 'PCT', DiscountValue: 0, DiscountAmount: 0, DiscountEditedBy: l.DiscountEditedBy };
      if (isSale) {
        x.IsFree = !!l.IsFree || !!p.IsPremium;
        x.UnitPrice = x.IsFree ? 0 : num(p.PricePerCase) * factor / caseQty;
        x.GrossAmount = x.IsFree ? 0 : r2(num(p.PricePerCase) * qtyBase / caseQty);
        x.PromoGroupId = (!x.IsFree && promo && promo.groupOf[p.ProductCode]) ? promo.groupOf[p.ProductCode] : '';
        x._mt = l.DiscountType; x._mv = l.DiscountValue;
      } else if (['TF', 'VL', 'VU'].indexOf(type) >= 0) {
        x.UnitPrice = rn(num(p.PricePerCase) * factor / caseQty, 4);          // มูลค่าอ้างอิงตามราคาขาย
        x.GrossAmount = r2(x.UnitPrice * qty);
      } else if (noMoney) {
        x.UnitPrice = 0; x.GrossAmount = 0;
      } else {
        var price = l.UnitPrice !== '' && l.UnitPrice !== null && l.UnitPrice !== undefined ? num(l.UnitPrice)
          : (SALE_PRICE.indexOf(type) >= 0 ? num(p.PricePerCase) * factor / caseQty : (p.CostPerCase !== undefined ? num(p.CostPerCase) * factor / caseQty : 0));
        x.UnitPrice = price;
        x.GrossAmount = r2(price * qty);
        if (type !== 'CN' && type !== 'RT') {
          x.DiscountType = l.DiscountType === 'BAHT' ? 'BAHT' : 'PCT';
          x.DiscountValue = Math.max(num(l.DiscountValue), 0);
          x.DiscountAmount = x.DiscountType === 'PCT' ? r2(x.GrossAmount * x.DiscountValue / 100) : r2(x.DiscountValue);
          if (x.DiscountAmount > Math.abs(x.GrossAmount)) x.DiscountAmount = Math.abs(x.GrossAmount);
        }
      }
      out.push(x);
      byKey[l._k] = x;
    });
    // Tier
    var groups = {};
    out.forEach(function (x) {
      if (!x.PromoGroupId) return;
      var g = groups[x.PromoGroupId] || (groups[x.PromoGroupId] = { pools: {} });
      g.pools[x.CaseQty] = (g.pools[x.CaseQty] || 0) + x.QtyBase;
    });
    var summary = [];
    Object.keys(groups).forEach(function (gid) {
      var g = groups[gid];
      var cases = 0, pools = [];
      Object.keys(g.pools).forEach(function (size) {
        var full = Math.floor(rn(g.pools[size] / Number(size), 6));
        cases += full;
        pools.push({ size: Number(size), toNext: rn(Number(size) * (full + 1) - g.pools[size], 4) });
      });
      var pg = promo.groups[gid] || { GroupName: gid, tiers: { PRE: [], VAN: [] } };
      var tiers = pg.tiers[channel] || [];
      var tier = null, next = null;
      tiers.forEach(function (tt) { if (cases >= tt.MinCases) tier = tt; else if (!next) next = tt; });
      g.tier = tier;
      summary.push({ id: gid, name: pg.GroupName, cases: cases, tier: tier, next: next, pools: pools });
    });
    out.forEach(function (x) {
      if (!isSale) return;
      var g = x.PromoGroupId ? groups[x.PromoGroupId] : null;
      if (g && g.tier && g.tier.DiscountType === 'PCT') x.AutoDiscountPct = g.tier.DiscountValue;
      if (x.IsFree) { x.DiscountAmount = 0; }
      else if (x.DiscountEditedBy) {
        x.DiscountType = x._mt === 'BAHT' ? 'BAHT' : 'PCT';
        x.DiscountValue = Math.max(num(x._mv), 0);
        x.DiscountAmount = x.DiscountType === 'PCT' ? r2(x.GrossAmount * x.DiscountValue / 100) : r2(x.DiscountValue);
      } else if (g && g.tier) {
        if (g.tier.DiscountType === 'PCT') { x.DiscountType = 'PCT'; x.DiscountValue = g.tier.DiscountValue; x.DiscountAmount = r2(x.GrossAmount * g.tier.DiscountValue / 100); }
        else { x.DiscountType = 'BAHT'; x.DiscountAmount = r2(g.tier.DiscountValue * x.QtyBase / x.CaseQty); x.DiscountValue = x.DiscountAmount; }
      }
      if (x.DiscountAmount > x.GrossAmount) x.DiscountAmount = x.GrossAmount;
    });
    out.forEach(function (x) { x.LineTotal = r2(x.GrossAmount - x.DiscountAmount); });
    // ยอดรวม
    var sub = 0, ld = 0, after = 0;
    out.forEach(function (x) { sub += x.GrossAmount; ld += x.DiscountAmount; after += x.LineTotal; });
    sub = r2(sub); ld = r2(ld); after = r2(after);
    var hdT = ed.h.HeaderDiscountType === 'BAHT' ? 'BAHT' : 'PCT';
    var hdV = num(ed.h.HeaderDiscountValue);
    var hd = hdT === 'BAHT' ? r2(hdV) : r2(after * Math.min(hdV, 100) / 100);
    if (hd > after) hd = after;
    var net = r2(after - hd);
    var vt = ed.h.VatType || 'EX';
    var rate = vt === 'NONE' ? 0 : num(S.boot.settings.VAT_RATE || 7);
    var vat = 0, total = net;
    if (vt === 'EX') { vat = r2(net * rate / 100); total = r2(net + vat); }
    else if (vt === 'IN') { vat = r2(net * rate / (100 + rate)); total = net; }
    return { lines: out, byKey: byKey, groups: summary, channel: channel, promoName: promo ? promo.Name : '',
             totals: { SubTotal: sub, LineDiscountTotal: ld, HeaderDiscountAmount: hd, AfterDiscount: net, VatType: vt, VatRate: rate, VatAmount: vat, NetTotal: total } };
  }

            if (type === 'C' && SALE_TIER.indexOf(ed.type) >= 0) {
